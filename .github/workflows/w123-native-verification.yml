name: W123 ordinary Linux kernel verification
on:
  push:
    branches: [cloud/postz-w1, cloud/postz-w2, cloud/postz-w3]
    paths:
      - .github/workflows/w123-native-verification.yml
      - finnor-os/**
      - scripts/**
      - packages/**
      - app/**
      - package.json
      - package-lock.json
      - next.config.*
      - vendor/**
permissions:
  contents: read
concurrency:
  group: w123-kernel-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kernel-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: finnor-os
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: finnor-os/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Reproduce original kernel escape and verify the repaired policy
        run: node scripts/s6/compare-linux-policy-e2e.mjs "$RUNNER_TEMP/w123-kernel-comparison"
      - name: Check source restoration after both actual kernel runs
        if: ${{ always() }}
        run: git diff --exit-code
      - name: Retain readable controlled kernel results in the job log
        if: ${{ always() }}
        run: |
          for phase in before after; do
            result="$RUNNER_TEMP/w123-kernel-comparison/$phase/results.json"
            if [ -f "$result" ]; then
              echo "W123_KERNEL_RESULT_BEGIN_$phase"
              cat "$result"
              echo "W123_KERNEL_RESULT_END_$phase"
            fi
          done
      - name: Retain controlled kernel evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: w123-kernel-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/w123-kernel-comparison/
          if-no-files-found: error
          retention-days: 7
  source-checks:
    uses: ./.github/workflows/source-checks.yml
  installed-worker:
    needs: source-checks
    uses: ./.github/workflows/ci.yml
    with:
      run_worker_image: true
  workforce-compensation:
    if: ${{ github.ref_name == 'cloud/postz-w2' || github.ref_name == 'cloud/postz-w3' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        episode: [before-exact, after-exact, after-wrong-amount, after-wrong-payee, after-wrong-receipt]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            finnor-os/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix finnor-os --no-audit --no-fund
      - name: Prepare exact locked scientific runtime
        run: |
          set -euo pipefail
          umask 077
          w2_uv_container="$(docker create ghcr.io/astral-sh/uv:0.10.9@sha256:10902f58a1606787602f303954cea099626a4adb02acbac4c69920fe9d278f82)"
          trap 'docker rm "$w2_uv_container" >/dev/null' EXIT
          docker cp "$w2_uv_container:/uv" "$RUNNER_TEMP/w2-uv"
          "$RUNNER_TEMP/w2-uv" python install 3.12.13
          "$RUNNER_TEMP/w2-uv" venv --python 3.12.13 "$RUNNER_TEMP/w2-scientific"
          "$RUNNER_TEMP/w2-uv" pip sync --require-hashes --only-binary :all: --python "$RUNNER_TEMP/w2-scientific/bin/python" finnor-os/scripts/postz-w1/requirements-native.txt
      - name: Exercise registered original and repaired receiving-owner joins
        run: python3 finnor-os/scripts/postz-w2/run-compensation-pair.py --episode "${{ matrix.episode }}" --python "$RUNNER_TEMP/w2-scientific/bin/python" --output "$RUNNER_TEMP/w2-compensation"
      - name: Check exact source restoration
        if: ${{ always() }}
        run: git diff --exit-code
      - name: Retain controlled owner comparison without private runtime files
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: w2-compensation-${{ matrix.episode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/w2-compensation/report/
          if-no-files-found: error
          retention-days: 7
