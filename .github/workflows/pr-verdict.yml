name: "PR - Code, build, tests and security"

on:
  pull_request:
    branches: [main, "codex/frozen-*"]
  push:
    branches: [codex/zw-contract-verification-20261123]

permissions:
  actions: read
  contents: read

concurrency:
  group: pr-verdict-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: "Select checks for this change"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      root: ${{ steps.scope.outputs.root }}
      dependencies: ${{ steps.scope.outputs.dependencies }}
      manifest_sha256: ${{ steps.scope.outputs.manifest_sha256 }}
      artifact_name: ${{ steps.scope.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.3
      - id: scope
        name: Classify the exact pull-request diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'f85465486e22b353f0c7b3d629af8277fa0aa530' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module <<'NODE'
          const { appendFileSync, mkdirSync, copyFileSync } = await import("node:fs")
          const { join } = await import("node:path")
          const { changedPullRequestFiles, classifyPullRequestFiles, writeChangedFilesEvidence } = await import("./scripts/release/pr-verdict-policy.mjs")
          const files = changedPullRequestFiles({ base: process.env.BASE_SHA, head: process.env.HEAD_SHA })
          const { backend, root, dependencies } = classifyPullRequestFiles(files)
          const directory = join(process.env.RUNNER_TEMP, "pr-verdict-input")
          mkdirSync(directory)
          const digest = writeChangedFilesEvidence({ path: join(directory, "changed-files.json"), files, head: process.env.HEAD_SHA, base: process.env.BASE_SHA })
          for (const name of ["pr-verdict-policy.mjs", "worktree-state.mjs"]) copyFileSync(join("scripts/release", name), join(directory, name))
          const output = process.env.GITHUB_OUTPUT
          appendFileSync(output, `backend=${backend}\nroot=${root}\ndependencies=${dependencies}\nmanifest_sha256=${digest}\nartifact_name=pr-verdict-input-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}\n`)
          NODE
      - name: Retain complete SHA-bound changed-file evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.scope.outputs.artifact_name }}
          path: ${{ runner.temp }}/pr-verdict-input/
          if-no-files-found: error
          retention-days: 7

  source:
    name: "Source and CI rules"
    needs: classify
    if: ${{ needs.classify.outputs.backend == 'true' || needs.classify.outputs.root == 'true' }}
    uses: ./.github/workflows/source-checks.yml
    with:
      backend: ${{ needs.classify.outputs.backend == 'true' }}
      root: ${{ needs.classify.outputs.root == 'true' }}

  backend:
    name: "Backend and Z compiler checks"
    needs: [classify, source]
    if: ${{ needs.classify.outputs.backend == 'true' }}
    uses: ./.github/workflows/ci.yml

  root:
    name: "Frontend checks"
    needs: [classify, source]
    if: ${{ needs.classify.outputs.root == 'true' }}
    uses: ./.github/workflows/marketing-ci.yml

  security:
    name: "Secret and dependency security"
    needs: classify
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml
    with:
      run_dependency_scan: ${{ needs.classify.outputs.dependencies == 'true' }}

  replay:
    name: "Business receipt replay"
    needs: [classify, source]
    if: ${{ needs.classify.outputs.backend == 'true' }}
    uses: ./.github/workflows/dealer-zero-replay.yml
    secrets:
      DEALER_ZERO_REPLAY_BASELINE: ${{ secrets.DEALER_ZERO_REPLAY_BASELINE }}
      DEALER_ZERO_REPLAY_CANDIDATE: ${{ secrets.DEALER_ZERO_REPLAY_CANDIDATE }}

  readiness:
    name: "Release readiness checks"
    needs: [classify, source]
    if: ${{ needs.classify.outputs.backend == 'true' }}
    uses: ./.github/workflows/release-readiness.yml

  completion-receipt:
    name: "Report completed PR checks"
    needs: verdict
    if: ${{ always() && github.event.pull_request.number == 187 }}
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: write
    uses: ./.github/workflows/ci-completion.yml
    with:
      pr_number: 187
      head_sha: ${{ github.event.pull_request.head.sha }}
      gate: required-pr-verdict
      result: ${{ needs.verdict.result }}

  verdict:
    name: required-pr-verdict
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: ${{ always() }}
    needs: [classify, source, backend, root, security, replay, readiness]
    env:
      CLASSIFY_RESULT: ${{ needs.classify.result }}
      SOURCE_RESULT: ${{ needs.source.result }}
      BACKEND_APPLICABLE: ${{ needs.classify.outputs.backend }}
      BACKEND_RESULT: ${{ needs.backend.result }}
      ROOT_APPLICABLE: ${{ needs.classify.outputs.root }}
      ROOT_RESULT: ${{ needs.root.result }}
      DEPENDENCY_APPLICABLE: ${{ needs.classify.outputs.dependencies }}
      SECURITY_RESULT: ${{ needs.security.result }}
      REPLAY_RESULT: ${{ needs.replay.result }}
      READINESS_RESULT: ${{ needs.readiness.result }}
      CHANGED_FILES_SHA256: ${{ needs.classify.outputs.manifest_sha256 }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || 'f85465486e22b353f0c7b3d629af8277fa0aa530' }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Read the completed scope manifest without a checkout
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.classify.outputs.artifact_name }}
          path: .ci-verdict
      - name: Emit the stable required verdict
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs"
          import { readChangedFilesEvidence, evaluateRequiredPrVerdict } from "./.ci-verdict/pr-verdict-policy.mjs"
          const applicable = (value) => value === "true"
          const { verdict, failures } = evaluateRequiredPrVerdict({
            files: readChangedFilesEvidence({ path: ".ci-verdict/changed-files.json", expectedSha256: process.env.CHANGED_FILES_SHA256, head: process.env.PR_HEAD_SHA, base: process.env.PR_BASE_SHA }),
            classifyResult: process.env.CLASSIFY_RESULT,
            sourceResult: process.env.SOURCE_RESULT,
            backendApplicable: applicable(process.env.BACKEND_APPLICABLE),
            backendResult: process.env.BACKEND_RESULT,
            rootApplicable: applicable(process.env.ROOT_APPLICABLE),
            rootResult: process.env.ROOT_RESULT,
            dependencyApplicable: applicable(process.env.DEPENDENCY_APPLICABLE),
            securityResult: process.env.SECURITY_RESULT,
            replayResult: process.env.REPLAY_RESULT,
            readinessResult: process.env.READINESS_RESULT,
          })
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n\`\`\`json\n${JSON.stringify(verdict, null, 2)}\n\`\`\`\n`)
          console.log(JSON.stringify(verdict))
          if (failures.length) throw new Error(`required PR verdict failed: ${failures.join(", ")}`)
          NODE
