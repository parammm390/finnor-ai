name: Worker image smoke after early preflight
on:
  push:
    branches: [codex/ci-worker-cache-benchmark-20261118]
permissions:
  contents: read
jobs:
  worker-image:
    name: "Worker cache / ${{ matrix.cache }}"
    strategy:
      fail-fast: false
      matrix:
        cache: [restore-only]
    runs-on: ubuntu-latest
    # First pinned exact native compilation is preparation, not a 30-second
    # decision. Later source-only changes restore its independent cached stage.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: .
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: finnor
          POSTGRES_PASSWORD: finnor
          POSTGRES_DB: finnor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finnor" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1fa0146abe5663b90b39f6969dc852fe6fb8c3e5
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: finnor-os/package-lock.json
      - name: Compile native worker inputs before dependency and image work
        run: node scripts/release/verify-ci-workflows.mjs
        env:
          FINNOR_CI_CHECK_LINUX_WORKER: "true"
      - run: npm ci --prefix finnor-os
      - name: Rehearse the actual installed-owner migration upgrades
        working-directory: finnor-os
        env:
          FINNOR_R1_EVIDENCE_DIR: ${{ runner.temp }}/finnor-r1-migrations
        run: |
          timeout --signal=TERM --kill-after=10s 90s node --import=tsx scripts/r1/run-owners.mts runtime-migrations
          timeout --signal=TERM --kill-after=10s 90s node --import=tsx scripts/r4/run-integrated.mts --migration-only --output "$RUNNER_TEMP/finnor-r4-migrations"
      - name: Derive exact worker smoke metadata
        run: |
          sha="$(git rev-parse HEAD)"
          echo "FINNOR_COMMIT_SHA=$sha" >> "$GITHUB_ENV"
          echo "FINNOR_BUILD_ID=finnor-${sha:0:12}" >> "$GITHUB_ENV"
          echo "FINNOR_VERSION=0.1.0+${sha:0:12}" >> "$GITHUB_ENV"
      - name: Prepare disposable worker smoke database
        run: |
          npm run db:bundle
          git diff --exit-code -- packages/db/migrations-bundle.ts packages/db/migration-head.ts
          npm run db:migrate
          npm run setup:langgraph
        working-directory: finnor-os
        env:
          DATABASE_URL: postgres://finnor:finnor@127.0.0.1:5432/finnor
          FINNOR_TEST_MANAGED_EXTENSIONS: omit
      - name: Verify relocated worker source custody
        run: node --test scripts/release/worker-image-layout.e2e.test.mjs
        env:
          FINNOR_WORKER_LAYOUT_EVIDENCE_DIR: ${{ runner.temp }}/finnor-worker-layout
      - name: Set up pinned QEMU for ARM64 image stages
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8
        with:
          platforms: arm64
      - name: Set up pinned cached image builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Check Docker build definition before compiling
        run: docker buildx build --check --file finnor-os/Dockerfile.worker .
      - name: Build exact application-worker image
        id: worker_image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: finnor-os/Dockerfile.worker
          load: true
          push: false
          tags: finnor-worker:${{ env.FINNOR_COMMIT_SHA }}
          build-args: FINNOR_BUILD_ID=${{ env.FINNOR_BUILD_ID }}
          labels: |
            org.opencontainers.image.revision=${{ env.FINNOR_COMMIT_SHA }}
            ai.finnor.build-id=${{ env.FINNOR_BUILD_ID }}
          # The protected release build on main publishes this cache.
          # Candidate builds restore it before building and testing the exact image.
          cache-from: type=gha,scope=finnor-worker-${{ runner.arch }}
          cache-to: ${{ matrix.cache == 'export' && format('type=gha,mode=max,scope=finnor-worker-{0}', runner.arch) || '' }}
      - name: Build and smoke-test exact worker image without production credentials
        run: bash scripts/release/smoke-worker-image.sh
        env:
          FINNOR_WORKER_PREBUILT_IMAGE_ID: ${{ steps.worker_image.outputs.imageid }}
      - name: Retain exact Linux worker smoke evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: worker-image-${{ matrix.cache }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/finnor-r1-migrations/results.json
            ${{ runner.temp }}/finnor-r4-migrations/results.json
            ${{ runner.temp }}/finnor-worker-image-smoke/*
            ${{ runner.temp }}/finnor-worker-image-smoke/linux-r3-runtime/**
            ${{ runner.temp }}/finnor-worker-layout/*.json
          if-no-files-found: warn
          retention-days: 7

