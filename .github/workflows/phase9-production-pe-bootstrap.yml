name: phase9-production-pe-bootstrap

on:
  workflow_run:
    workflows: ["production-release"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase9-production-pe-bootstrap.yml"
      - "scripts/release/bootstrap-phase9-production-pe.mjs"

concurrency:
  group: phase9-production-pe-bootstrap
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bootstrap:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      FINNOR_ENVIRONMENT: production
      FINNOR_PHASE9_OWNER_EMAIL: ${{ vars.FINNOR_PHASE9_OWNER_EMAIL || 'owner@test-dealer.finnor.local' }}
      FINNOR_PHASE9_PE_TENANT_ID: ${{ vars.FINNOR_PHASE9_PE_TENANT_ID || '7d57aa44-df32-4ff7-87e8-e0b8236d9c31' }}
      FINNOR_PHASE9_PE_CLIENT_KEY: ${{ vars.FINNOR_PHASE9_PE_CLIENT_KEY || 'finnor-internal-pe-production' }}
      FINNOR_PHASE9_PE_TENANT_NAME: ${{ vars.FINNOR_PHASE9_PE_TENANT_NAME || 'Finnor Private Equity Internal' }}
    steps:
      - name: Checkout bootstrap source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: finnor-os/package-lock.json

      - name: Require protected production access
        run: test -n "$VERCEL_TOKEN"

      - name: Install workspace dependencies
        run: npm ci
        working-directory: finnor-os

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@50.15.1

      - name: Pull protected production database configuration
        run: |
          VERCEL_ORG_ID="$(node -p "require('../../../infra/deployment/production.contract.json').topology.api.organizationId")"
          VERCEL_PROJECT_ID="$(node -p "require('../../../infra/deployment/production.contract.json').topology.api.projectId")"
          export VERCEL_ORG_ID VERCEL_PROJECT_ID
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
        working-directory: finnor-os/apps/api

      - name: Preflight PE owner bootstrap without mutation
        run: |
          node scripts/release/bootstrap-phase9-production-pe.mjs \
            --database-env finnor-os/apps/api/.vercel/.env.production.local

      - name: Converge live owner identity onto Private Equity tenant
        run: |
          node scripts/release/bootstrap-phase9-production-pe.mjs \
            --database-env finnor-os/apps/api/.vercel/.env.production.local \
            --apply

      - name: Verify bootstrap is idempotent
        run: |
          node scripts/release/bootstrap-phase9-production-pe.mjs \
            --database-env finnor-os/apps/api/.vercel/.env.production.local
