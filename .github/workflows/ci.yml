# CI (§29): lint/typecheck + vitest on every PR. Production deployment is owned by
# production-release.yml and its commit-locked Phase 5 readiness/release job graph.
# NOTE: this repo lives at finnor-os/ inside the FINNOR repository, so paths are scoped.
name: finnor-os-ci
on:
  workflow_call:
    inputs:
      run_worker_image:
        description: Production builds and smokes its publishable image in the release job
        type: boolean
        default: true
permissions:
  contents: read
defaults:
  run:
    working-directory: finnor-os
jobs:
  production-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            finnor-os/package-lock.json
      - run: npm install --global vercel@50.15.1
      - name: Verify durable API artifact handoff
        run: node --test scripts/release/api-artifact.e2e.test.mjs
      - name: Build every production artifact and exercise the actual compiled API
        run: node scripts/release/production-artifact.e2e.mjs
        env:
          FINNOR_ARTIFACT_EVIDENCE_DIR: ${{ runner.temp }}/finnor-production-artifact-evidence
      - name: Retain actual artifact and runtime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/finnor-production-artifact-evidence/*
          if-no-files-found: warn
          retention-days: 7

  worker-image:
    if: ${{ inputs.run_worker_image }}
    runs-on: ubuntu-latest
    # First pinned exact native compilation is preparation, not a 30-second
    # decision. Later source-only changes restore its independent cached stage.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: .
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: finnor
          POSTGRES_PASSWORD: finnor
          POSTGRES_DB: finnor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finnor" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: finnor-os/package-lock.json
      - run: npm ci --prefix finnor-os
      - name: Derive exact worker smoke metadata
        run: |
          sha="$(git rev-parse HEAD)"
          echo "FINNOR_COMMIT_SHA=$sha" >> "$GITHUB_ENV"
          echo "FINNOR_BUILD_ID=finnor-${sha:0:12}" >> "$GITHUB_ENV"
          echo "FINNOR_VERSION=0.1.0+${sha:0:12}" >> "$GITHUB_ENV"
      - name: Prepare disposable worker smoke database
        run: |
          npm run db:bundle
          git diff --exit-code -- packages/db/migrations-bundle.ts
          npm run db:migrate
          npm run setup:langgraph
        working-directory: finnor-os
        env:
          DATABASE_URL: postgres://finnor:finnor@127.0.0.1:5432/finnor
          FINNOR_TEST_MANAGED_EXTENSIONS: omit
      - name: Verify relocated worker source custody
        run: node --test scripts/release/worker-image-layout.e2e.test.mjs scripts/release/analytical-profile.e2e.test.mjs
        env:
          FINNOR_WORKER_LAYOUT_EVIDENCE_DIR: ${{ runner.temp }}/finnor-worker-layout
      - name: Set up pinned QEMU for ARM64 image stages
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8
        with:
          platforms: arm64
      - name: Set up pinned cached image builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Check Docker build definition before compiling
        run: docker buildx build --check --file finnor-os/Dockerfile.worker .
      - name: Build exact application-worker image
        id: worker_image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: finnor-os/Dockerfile.worker
          load: true
          push: false
          tags: finnor-worker:${{ env.FINNOR_COMMIT_SHA }}
          build-args: FINNOR_BUILD_ID=${{ env.FINNOR_BUILD_ID }}
          labels: |
            org.opencontainers.image.revision=${{ env.FINNOR_COMMIT_SHA }}
            ai.finnor.build-id=${{ env.FINNOR_BUILD_ID }}
          cache-from: type=gha,scope=finnor-worker-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=finnor-worker-${{ runner.arch }}
      - name: Build and smoke-test exact worker image without production credentials
        run: bash scripts/release/smoke-worker-image.sh
        env:
          FINNOR_WORKER_PREBUILT_IMAGE_ID: ${{ steps.worker_image.outputs.imageid }}
      - name: Retain exact Linux worker smoke evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: worker-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/finnor-worker-image-smoke/*
            ${{ runner.temp }}/finnor-worker-image-smoke/linux-r3-runtime/**
            ${{ runner.temp }}/finnor-worker-layout/*.json
          if-no-files-found: warn
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: finnor
          POSTGRES_PASSWORD: finnor
          POSTGRES_DB: finnor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finnor" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://finnor:finnor@localhost:5432/finnor
      REDIS_URL: redis://localhost:6379
      AUTH_DEV_BYPASS: "1"
      # CI uses vanilla PostgreSQL; the migration runner rejects this test seam
      # for the canonical production database.
      FINNOR_TEST_MANAGED_EXTENSIONS: omit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: finnor-os/package-lock.json
      - run: npm ci
      # Historical S1 proofs require actual database commit visibility. Configure
      # only this disposable CI service before any migration/source fixture exists.
      - name: Enable commit timestamps on disposable PostgreSQL
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$POSTGRES_SERVICE_ID" psql -U finnor -d finnor -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET track_commit_timestamp = 'on'"
          docker restart "$POSTGRES_SERVICE_ID"
          for attempt in $(seq 1 30); do
            if docker exec "$POSTGRES_SERVICE_ID" pg_isready -U finnor -d finnor; then
              test "$(docker exec "$POSTGRES_SERVICE_ID" psql -U finnor -d finnor -Atc 'SHOW track_commit_timestamp')" = on
              break
            fi
            test "$attempt" -lt 30
            sleep 1
          done
      # source-checks.yml has already certified types and generated inventories.
      - run: npm run db:migrate
      - run: npm run db:seed
      # The setup file is also loaded by Vitest, but a fresh database does not have
      # the target table at module-load time. Install the disposable legacy-fixture
      # seam explicitly after migrations so pre-Phase-5 generic fixtures get their
      # test-only Water identity; production code remains fail-closed.
      - name: Install disposable legacy fixture seam
        run: npx tsx scripts/install-vertical-fixture-seam.ts
      # A truly fresh runner database needs the LangGraph schema explicitly; local dev
      # often hides this because its embedded Postgres data directory persists.
      - run: npm run setup:langgraph
      # Phase 5 deliberately retires the Water-only conversation resolver. Its
      # old Phase 6 integration fixture asserts Water appointment/household
      # entities and is outside this release gate; do not silently re-enable
      # that vertical while certifying the retirement boundary.
      # Vitest shards partition the full inventory. Files remain serialized
      # inside each shard, and GitHub gives each matrix job its own services.
      - run: npm test -- --exclude tests/integration/phase6-conversation-context-kernel.test.ts --shard=${{ matrix.shard }}/3
        env:
          FINNOR_S7_CI_EVIDENCE_DIR: ${{ runner.temp }}/finnor-s7-evidence
          FINNOR_PRODUCTION_PREFLIGHT_EVIDENCE_DIR: ${{ runner.temp }}/finnor-production-query-evidence
          FINNOR_PE_OBJECTIVE_EVIDENCE_DIR: ${{ runner.temp }}/finnor-pe-objective-evidence
      - name: Retain S7 native owner proof diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s7-native-owner-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/finnor-s7-evidence/**/results.json
            ${{ runner.temp }}/finnor-s7-evidence/**/partial-results.json
            ${{ runner.temp }}/finnor-s7-evidence/**/runner.log
            ${{ runner.temp }}/finnor-production-query-evidence/*.json
            ${{ runner.temp }}/finnor-pe-objective-evidence/**
          if-no-files-found: warn
          retention-days: 7

  operating-profit:
    name: S4 operating-profit owner and replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: finnor-os/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Prepare the pinned conditional S3 numerical backend
        run: |
          python3 -m venv "$RUNNER_TEMP/s4-python"
          "$RUNNER_TEMP/s4-python/bin/pip" install --disable-pip-version-check -r packages/epistemic-runtime/src/intervention-requirements.txt
          echo "FINNOR_S3_PYTHON=$RUNNER_TEMP/s4-python/bin/python" >> "$GITHUB_ENV"
      - name: Exercise full S4 owner, operating-profit and retained-kernel replay paths
        run: python3 scripts/s4/run-local.py
        env:
          FINNOR_S4_CI_EVIDENCE_DIR: ${{ runner.temp }}/finnor-s4-evidence
      - name: Retain inputs, source snapshot, API results and replay evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s4-operating-profit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/finnor-s4-evidence/**
          if-no-files-found: warn
          retention-days: 7

  phase7:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: finnor
          POSTGRES_PASSWORD: finnor
          POSTGRES_DB: finnor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finnor" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://finnor:finnor@localhost:5432/finnor
      REDIS_URL: redis://localhost:6379
      AUTH_DEV_BYPASS: "1"
      FINNOR_TEST_MANAGED_EXTENSIONS: omit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            finnor-os/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: .
      - name: Enable commit tracking before P7 fixture creation
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$POSTGRES_SERVICE_ID" psql -U finnor -d finnor -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET track_commit_timestamp = 'on'"
          docker restart "$POSTGRES_SERVICE_ID"
          for attempt in $(seq 1 30); do
            if docker exec "$POSTGRES_SERVICE_ID" pg_isready -U finnor -d finnor; then
              test "$(docker exec "$POSTGRES_SERVICE_ID" psql -U finnor -d finnor -Atc 'SHOW track_commit_timestamp')" = on
              break
            fi
            test "$attempt" -lt 30
            sleep 1
          done
      - name: Prepare the independent P7 database
        run: |
          npm run db:migrate
          npm run db:seed
          npx --no-install tsx scripts/install-vertical-fixture-seam.ts
          npm run setup:langgraph
      - name: Phase 7 governed workforce and learning certification
        run: |
          set -euo pipefail
          npm run release:pe-p7-workforce-learning | tee "$RUNNER_TEMP/p7-certification.log"
          node - "$RUNNER_TEMP/p7-certification.log" <<'NODE'
          const fs = require("node:fs");
          const lines = fs.readFileSync(process.argv[2], "utf8").split(/\r?\n/);
          const records = lines.filter((line) => line.startsWith("P7_CERTIFICATION "));
          if (lines.some((line) => line.startsWith("P7_CERTIFICATION_FAIL ")) || records.length !== 1) process.exit(1);
          const result = JSON.parse(records[0].slice("P7_CERTIFICATION ".length));
          if (result.status !== "PASS" || result.mandatoryCases !== 21 ||
              result.passedCases !== 21 || result.failedCases !== 0 ||
              result.skippedCases !== 0 || result.todoCases !== 0 ||
              result.executableTests < 1) process.exit(1);
          NODE
      - name: Retain P7 certification diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p7-certification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p7-certification.log
          if-no-files-found: warn
          retention-days: 7
