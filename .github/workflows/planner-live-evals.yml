name: planner-live-evals
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: finnor-os
jobs:
  live-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: finnor-os/package-lock.json
      - run: npm ci
      - name: Run the credentialed planner evaluation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # The router only includes legacy Groq when the purpose route is explicit;
          # this workflow supplies Groq as its sole live-eval credential, so pin the
          # planning route instead of silently running with no configured provider.
          LLM_PROVIDER_PLANNING: groq
          LLM_PROVIDER_REPAIR: groq
          # All 41 current Core/PE candidate cases must pass. This plan-only
          # evaluation never seeds a business database or executes effects.
          PLANNER_EVAL_PACE_MS: "30000"
        run: npm run eval:planner:live -- --out "$RUNNER_TEMP/planner-live-eval"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: planner-live-evaluation
          path: ${{ runner.temp }}/planner-live-eval
