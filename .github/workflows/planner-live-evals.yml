name: planner-live-evals
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
defaults:
  run:
    working-directory: finnor-os
jobs:
  live-eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finnor
          POSTGRES_PASSWORD: finnor
          POSTGRES_DB: finnor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finnor" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://finnor:finnor@localhost:5432/finnor
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # The router only includes legacy Groq when the purpose route is explicit;
      # this workflow supplies Groq as its sole live-eval credential, so pin the
      # planning route instead of silently running with no configured provider.
      LLM_PROVIDER_PLANNING: groq
      LLM_PROVIDER_REPAIR: groq
      # The available Groq tier is TPM-limited; pace the complete 41-scenario
      # harness explicitly instead of allowing a rate-limit wall to mask planner
      # behavior. This does not reduce the scenario set or alter production routing.
      PLANNER_EVAL_PACE_MS: "30000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: finnor-os/package-lock.json
      - run: npm ci
      - run: npm run eval:planner:live
