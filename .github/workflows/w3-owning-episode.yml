name: W3 actual fulfillment owner episode
on:
  workflow_call:
    inputs:
      episode:
        type: string
        required: true
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            finnor-os/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix finnor-os --no-audit --no-fund
      - name: Prepare both exact scientific populations
        run: |
          set -euo pipefail
          umask 077
          w3_uv_container="$(docker create ghcr.io/astral-sh/uv:0.10.9@sha256:10902f58a1606787602f303954cea099626a4adb02acbac4c69920fe9d278f82)"
          trap 'docker rm "$w3_uv_container" >/dev/null' EXIT
          docker cp "$w3_uv_container:/uv" "$RUNNER_TEMP/w3-uv"
          "$RUNNER_TEMP/w3-uv" python install 3.11.15 3.12.13
          "$RUNNER_TEMP/w3-uv" venv --python 3.11.15 "$RUNNER_TEMP/w3-s3"
          "$RUNNER_TEMP/w3-uv" venv --python 3.12.13 "$RUNNER_TEMP/w3-s5"
          "$RUNNER_TEMP/w3-uv" pip sync --only-binary :all: --python "$RUNNER_TEMP/w3-s3/bin/python" finnor-os/scripts/postz/w3/requirements-s3.lock
          "$RUNNER_TEMP/w3-uv" pip sync --only-binary :all: --python "$RUNNER_TEMP/w3-s5/bin/python" finnor-os/packages/epistemic-runtime/src/requirements-s5.txt
      - name: Check the complete W3 owner and driver types
        run: node --max-old-space-size=2048 finnor-os/node_modules/typescript/bin/tsc -p finnor-os/scripts/postz/w3/tsconfig.json
      - name: Exercise the actual original owner journey
        working-directory: finnor-os
        env:
          FINNOR_W3_EPISODE: ${{ inputs.episode }}
          FINNOR_S3_PYTHON: ${{ runner.temp }}/w3-s3/bin/python
          FINNOR_S5_PYTHON: ${{ runner.temp }}/w3-s5/bin/python
        run: |
          set -euo pipefail
          umask 077
          case "$FINNOR_W3_EPISODE" in
            fast) flags=(--fast); limit=120 ;;
            native) flags=(); limit=1200 ;;
            publication) flags=(--publication-challenge); limit=1200 ;;
            *) echo 'Unsupported original owning episode'; exit 2 ;;
          esac
          timeout --signal=TERM --kill-after=30s "${limit}s" node --import=tsx scripts/postz/w3/native.mts --output "$RUNNER_TEMP/w3-owner" "${flags[@]}"
      - name: Check exact source preservation
        if: ${{ always() }}
        run: git diff --exit-code
      - name: Retain controlled original and observed owning evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: w3-owner-${{ inputs.episode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/w3-owner/result.json
            ${{ runner.temp }}/w3-owner/cases/
            ${{ runner.temp }}/w3-owner/source-cut.json
            ${{ runner.temp }}/w3-owner/terminal-failure.json
            ${{ runner.temp }}/w3-owner/publication/
          if-no-files-found: error
          retention-days: 7
