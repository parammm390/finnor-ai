name: "Z0 - Work display, reload, sign-in and privacy"

on:
  push:
    branches: [codex/project-z0-resume, codex/project-z0-identity, codex/project-z0-useful, codex/project-z0-r12, codex/project-z0-mounted, codex/project-z0-recovery, codex/project-z0-economic, codex/project-z0-confidential, codex/zw-integration-quality-20261115, codex/zw-release-proof-20261121]

permissions:
  contents: read

concurrency:
  group: project-z0-native-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  completion-receipt:
    name: "Report completed Z0 checks"
    needs: original-owner
    if: ${{ always() && github.ref_name == 'codex/zw-integration-quality-20261115' }}
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: write
    uses: ./.github/workflows/ci-completion.yml
    with:
      pr_number: 187
      head_sha: ${{ github.sha }}
      gate: original-owner (default)
      result: ${{ needs.original-owner.result }}

  original-owner:
    name: "original-owner (${{ matrix.mode }})"
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(github.ref_name == 'codex/project-z0-recovery' && '["current-claim-source","current-claim-parent","current-claim-terms","current-claim-rights","revoked-accept","revoked-use","boundaries"]' || '["default"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            finnor-os/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix finnor-os --no-audit --no-fund
      - name: Verify required-service and scenario process exits
        run: node scripts/project-z/native-lifecycle.e2e.mjs "$RUNNER_TEMP/native-lifecycle.json"
      - name: Retain finite process lifecycle receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-lifecycle.json
          if-no-files-found: error
          retention-days: 7
      - name: Install the locked Chromium build
        if: github.ref_name == 'codex/project-z0-mounted' || (github.ref_name == 'codex/zw-integration-quality-20261115' || github.ref_name == 'codex/zw-release-proof-20261121')
        run: PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/z0-chromium" node node_modules/playwright/cli.js install --with-deps chromium
      - name: Compare real Canvas activation before and after the repair
        if: (github.ref_name == 'codex/zw-integration-quality-20261115' || github.ref_name == 'codex/zw-release-proof-20261121')
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/z0-chromium
        run: |
          set -euo pipefail
          baseline=2b7a158c95df2e5afd5f5dc9c2e8644b5fa79f61
          git fetch --no-tags --depth=1 origin "$baseline"
          if node scripts/centropy/verify-canvas-activation.mjs "$RUNNER_TEMP/canvas-before" "--baseline=$baseline"; then
            echo "::error::The original navigation defect was not reproduced"
            exit 1
          fi
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const report = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/canvas-before/result.json', 'utf8'))
          assert.equal(report.rows.length, 1)
          assert.equal(report.rows[0].status, 'FAIL')
          assert.equal(report.rows[0].stage, 'EXPLICIT_SELECTION_WITHOUT_VISIBILITY')
          JS
          node scripts/centropy/verify-canvas-activation.mjs "$RUNNER_TEMP/canvas-after"
      - name: Compare actual Workspace refresh, private scope and late responses
        if: (github.ref_name == 'codex/zw-integration-quality-20261115' || github.ref_name == 'codex/zw-release-proof-20261121')
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/z0-chromium
        run: |
          set -euo pipefail
          baseline=59fb04956507a883bb689f4ae774719a02389c66
          git fetch --no-tags --depth=1 origin "$baseline"
          if node scripts/centropy/verify-workspace-refresh.mjs "$RUNNER_TEMP/workspace-before" "--baseline=$baseline"; then
            echo "::error::The original same-scope instrument reset was not reproduced"
            exit 1
          fi
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const report = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/workspace-before/result.json', 'utf8'))
          assert.equal(report.rows.length, 2)
          assert.equal(report.rows[0].status, 'PASS')
          assert.equal(report.rows[1].status, 'FAIL')
          assert.equal(report.rows[1].stage, 'HELD_SAME_SCOPE_REFRESH')
          JS
          node scripts/centropy/verify-workspace-refresh.mjs "$RUNNER_TEMP/workspace-after"
      - name: Retain Canvas comparison receipts
        if: ${{ always() && (github.ref_name == 'codex/zw-integration-quality-20261115' || github.ref_name == 'codex/zw-release-proof-20261121') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: canvas-activation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/canvas-before/result.json
            ${{ runner.temp }}/canvas-after/result.json
            ${{ runner.temp }}/workspace-before/result.json
            ${{ runner.temp }}/workspace-after/result.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify the installed economic programme reader
        if: github.ref_name == 'codex/project-z0-economic'
        working-directory: finnor-os
        run: |
          npm run db:bundle
          npm run openapi
          npm run build --workspace @finnor/api
          node --import=tsx scripts/y1/build-runtime.mts
          FINNOR_Y1_BUILT_API=1 FINNOR_Y1_EVIDENCE_DIR="$RUNNER_TEMP/z0-economic" \
            node --import=tsx scripts/y1/run-installed.mts
      - name: Run the native owner scenario
        if: github.ref_name != 'codex/project-z0-economic'
        env:
          Z0_RECOVERY_MODE: ${{ matrix.mode }}
        run: |
          scenario=z0-session.mjs
          profiles=z0
          launch_args=()
          if [ "$GITHUB_REF_NAME" = "codex/project-z0-identity" ]; then
            scenario=z0-d1-session.mjs
          elif [ "$GITHUB_REF_NAME" = "codex/project-z0-confidential" ]; then
            scenario=z0-confidential-query.mjs
            profiles=y4
          elif [ "$GITHUB_REF_NAME" = "codex/project-z0-useful" ]; then
            export FINNOR_Z0_MODE=workstream
          elif [ "$GITHUB_REF_NAME" = "codex/project-z0-r12" ]; then
            scenario=z0-r12-session.mjs
            profiles=v2
          elif [ "$GITHUB_REF_NAME" = "codex/project-z0-mounted" ] || [ "$GITHUB_REF_NAME" = "codex/zw-integration-quality-20261115" ] || [ "$GITHUB_REF_NAME" = "codex/zw-release-proof-20261121" ]; then
            scenario=z0-mounted-session.mjs
            export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/z0-chromium"
            launch_args+=(--budget-ms=3300000)
          elif [ "$GITHUB_REF_NAME" = "codex/project-z0-recovery" ]; then
            case "$Z0_RECOVERY_MODE" in
              current-*)
                export FINNOR_Z0_MODE=current
                stage="${Z0_RECOVERY_MODE#current-}"
                dependency="${stage#*-}"
                stage="${stage%%-*}"
                export FINNOR_Z0_DEPENDENCY="${dependency^^}"
                export FINNOR_Z0_CURRENTNESS_STAGE="${stage^^}"
                ;;
              boundaries) launch_args+=(--budget-ms=3300000); export FINNOR_Z0_MODE=boundaries ;;
              *) export FINNOR_Z0_MODE="$Z0_RECOVERY_MODE" ;;
            esac
          fi
          install -d -m 700 "$GITHUB_WORKSPACE/.centropy-certification"
          taskset -c 0,1 node scripts/project-z/run-native-scenario.mjs \
            --name="z0-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --evidence="$RUNNER_TEMP/z0-native" --profiles="$profiles" --no-worker --forward-env=FINNOR_Z0_MODE \
            --forward-env=PLAYWRIGHT_BROWSERS_PATH --forward-env=FINNOR_Z0_DEPENDENCY \
            --forward-env=FINNOR_Z0_CURRENTNESS_STAGE "${launch_args[@]}" \
            --scenario="$GITHUB_WORKSPACE/finnor-os/scripts/project-z/native/$scenario"
      - name: Record native case outcomes
        if: ${{ always() }}
        env:
          Z0_RECOVERY_MODE: ${{ matrix.mode }}
        run: |
          node --input-type=module <<'JS'
          import { existsSync, readdirSync, readFileSync, writeFileSync } from 'node:fs'
          import { join } from 'node:path'

          const root = join(process.env.RUNNER_TEMP, 'z0-native')
          const scenario = join(root, 'scenario-01')
          const state = join(process.env.GITHUB_WORKSPACE, '.centropy-certification',
            'z0-ci-' + process.env.GITHUB_RUN_ID + '-' + process.env.GITHUB_RUN_ATTEMPT)
          const files = existsSync(scenario) ? readdirSync(scenario) : []
          const typedCode = value => typeof value === 'string' && /^[A-Z0-9_]{3,160}$/.test(value) ? value : null
          const identifier = value => typeof value === 'string' && /^[a-zA-Z0-9_.]{1,160}$/.test(value) ? value : null
          const predicateFrom = value => typeof value === 'string'
            ? value.match(/^(?:[A-Za-z]+Error: |Error: )?([A-Z][A-Z0-9_]{2,160})(?=[: \n]|$)/)?.[1] ?? null : null
          const sqlIdentifier = value => typeof value === 'string'
            ? value.match(/(?:violates (?:check|foreign key|unique) constraint|column|relation) "([a-z0-9_.]{1,120})"/i)?.[1] ?? null : null
          const jobFailure = job => ({
            status: identifier(job.status),
            predicate: predicateFrom(job.failure_detail) ?? predicateFrom(job.error),
            identifier: sqlIdentifier(job.failure_detail) ?? sqlIdentifier(job.error),
            location: (job.error ?? '').match(/\/finnor-os\/((?:packages|apps\/worker)\/[a-zA-Z0-9_./-]+\.m?ts:\d+:\d+)/)?.[1] ?? null,
          })
          const results = files.filter(name => /^(?:z0|r12)-\d+-case-[A-Z0-9-]+[a-z]?\.json$/.test(name)).sort()
            .map(name => {
              const { id, outcome, error, errorCode, errorType, detail, reason } = JSON.parse(readFileSync(join(scenario, name), 'utf8'))
              const predicate = predicateFrom(error)
                ?? typedCode(errorCode) ?? typedCode(detail?.predicate) ?? predicateFrom(detail?.reason ?? reason)
                ?? (/^[A-Za-z]{3,30}$/.test(errorType ?? '') ? errorType : null)
              const causePredicate = typeof error === 'string'
                ? error.match(/^(?:Z0_FIXTURE_TERMINAL_(?:COMPILER|PROGRAMME|SESSION)_[A-Z_]+|CHECKER_BARRIER_MISSED_[A-Z_]+):([A-Z0-9_]{3,160})(?=[: ]|$)/)?.[1] ?? null : null
              const path = ['MODEL_USED', 'DIRECT_FALLBACK'].includes(detail?.path) ? detail.path : null
              const fallbackReason = path === 'DIRECT_FALLBACK' && /^Z0_MODEL_[A-Z0-9_]{1,100}$/.test(detail?.fallbackReason ?? '')
                ? detail.fallbackReason : null
              const httpStatus = Number.isInteger(detail?.status) ? detail.status : null
              const responseCode = typedCode(detail?.code)
              const budget = id.startsWith('CUR-') && detail?.budget ? {
                applicationDebits: Number.isInteger(detail.budget.applicationDebits) ? detail.budget.applicationDebits : null,
                withinEnvelope: detail.budget.withinEnvelope === true,
                originalEnvelopeRetained: detail.before?.original?.envelopes === detail.after?.original?.envelopes,
                originalEpisodeRetained: detail.before?.episode === detail.after?.episode,
                originalStatusBefore: identifier(detail.before?.original?.status),
                originalStatusAfter: identifier(detail.after?.original?.status),
                chargesBefore: detail.afterMutation?.charges?.count,
                chargesAfter: detail.after?.charges?.count,
              } : null
              const rejected = Array.isArray(detail?.failures) ? detail.failures.map(entry => ({
                carrier: /^[a-z0-9_]{3,100}$/.test(entry.carrier ?? '') ? entry.carrier : null,
                status: Number.isInteger(entry.status) ? entry.status : null,
                code: typedCode(entry.code),
              })) : []
              const readbackFailures = id === 'P0-00' && Array.isArray(detail?.failures) ? detail.failures.map(entry => ({
                name: /^[a-zA-Z]{3,45}$/.test(entry.name ?? '') ? entry.name : null,
                sqlState: typedCode(entry.sqlState),
                column: /^[a-zA-Z0-9_."]{1,120}$/.test(entry.column ?? '') ? entry.column : null,
              })) : []
              const ownerRead = detail?.ownerRead && Number.isInteger(detail.ownerRead.status)
                ? { status: detail.ownerRead.status, code: typedCode(detail.ownerRead.code) } : null
              const continuationJobs = Array.isArray(detail?.continuationJobs) ? detail.continuationJobs.map(jobFailure) : []
              const objective = detail?.objective ? {
                state: identifier(detail.objective.loop?.state),
                jobs: detail.objective.jobs.map(job => ({ type: identifier(job.type), ...jobFailure(job) })),
                steps: detail.objective.steps.map(step => ({
                  phase: identifier(step.phase), decision: identifier(step.decision_kind),
                  outcome: identifier(step.iteration_outcome), failure: typedCode(step.failure?.code),
                })),
                queries: detail.objective.queries.map(query => ({
                  status: identifier(query.status), failure: typedCode(query.failure?.code),
                })),
              } : null
              return { id, outcome, predicate, causePredicate, sqlIdentifier: sqlIdentifier(error), path, fallbackReason,
                httpStatus, responseCode, budget, rejected, readbackFailures, ownerRead, continuationJobs, objective }
            })
          const acquisitionFile = files.find(name => /^z0-\d+-acquisition-failure-session\.json$/.test(name))
          const acquisition = acquisitionFile ? JSON.parse(readFileSync(join(scenario, acquisitionFile), 'utf8')) : null
          const acquisitionFailure = acquisition ? {
            status: typedCode(acquisition.session?.status),
            reason: typedCode(acquisition.session?.reason),
            dispositions: (acquisition.dispositions ?? []).map(({ disposition, reason, diagnostic }) => ({
              disposition: typedCode(disposition), reason: typedCode(reason),
              database: diagnostic ? Object.fromEntries(['code', 'constraint', 'table', 'databaseFunction', 'routine']
                .map(field => [field, identifier(diagnostic[field])])) : null,
            })),
          } : null
          const fixtureDirs = [scenario, join(state, 'z0m-private')]
          const fixtureFailures = fixtureDirs.flatMap(dir => existsSync(dir) ? readdirSync(dir)
            .filter(name => /^parent-[a-z0-9-]{1,48}-queue\.private\.json$/.test(name))
            .map(name => join(dir, name)) : []).map(name => {
            const { queue } = JSON.parse(readFileSync(name, 'utf8'))
            return queue.filter(job => job.status !== 'completed').map(job => ({
              type: identifier(job.type), compiler: typedCode(job.compiler_status), programme: typedCode(job.programme_status),
              ...jobFailure({ status: job.status, error: job.reason }),
            }))
          })
          const mountedFile = join(scenario, 'z0-mounted-session.v1.json')
          const mountedCaseFiles = files.filter(name => /^case-M-\d{2}\.json$/.test(name)).sort()
          const mountedCases = mountedCaseFiles.length
            ? mountedCaseFiles.map(name => JSON.parse(readFileSync(join(scenario, name), 'utf8')))
            : existsSync(mountedFile) ? JSON.parse(readFileSync(mountedFile, 'utf8')).cases : []
          const oracleFields = new Set(['status', 'deadline', 'charge count', 'effect count', 'budget', 'consumed',
            'original deadline', 'wall deadline', 'compiler status', 'compiler revision', 'compiler attempts', 'acquisition units'])
          const browserStages = new Set(['START_BROWSER', 'SIGN_IN', 'CONFIRM_IDENTITY', 'OPEN_ORIGINAL_WORK',
            'READ_OWNER_ORACLE', 'READ_INITIAL_PANELS', 'FIRST_RELOAD', 'SECOND_RELOAD', 'CHECK_RELOADED_PANELS',
            'START_REFRESH_BROWSER', 'SIGN_IN_FOR_REFRESH', 'OPEN_WORK_FOR_REFRESH', 'ADVANCE_REFRESH_CLOCK', 'READ_WORK_AFTER_REFRESH',
            'BEFORE_LOGOUT_WORK', 'AUTH_LOGOUT', 'SIGN_IN_AGAIN', 'OPEN_WORK_AFTER_SIGN_IN', 'CHECK_RESTORED_WORK',
            'CONFIRM_ORIGINAL_OWNER', 'SWITCH_PRINCIPAL_WITH_HELD_READ'])
          const browserProbeCauses = new Set(['NAVIGATION_CONTEXT_DESTROYED', 'PAGE_OR_BROWSER_CLOSED',
            'EVALUATOR_HELPER_MISSING', 'PAGE_EVALUATOR_REFERENCE_ERROR', 'PAGE_EVALUATOR_SYNTAX_ERROR',
            'EVALUATION_TIMEOUT', 'BROWSER_PROTOCOL_ERROR', 'OTHER_EVALUATE_FAILURE'])
          const reloadFields = new Set(['work', 'session', 'status', 'application', 'institution', 'budget', 'charges', 'costs'])
          const budgetChecks = ['sqlAgreesBefore', 'sqlAgreesAfter', 'shownMatchesBefore', 'shownMatchesAfter', 'ownerBudgetUnchanged']
          const budgetCuts = ['firstReload', 'secondReload', 'initial', 'reloaded']
          const budgetCutResults = ['MATCH', 'INVALID_PROJECTION', 'RESERVATION_MISMATCH', 'ENVELOPE_MISMATCH',
            'LEDGER_NOT_APPEND_ONLY', 'STALE_CHARGE_COUNT', 'FUTURE_CHARGE_COUNT', 'BALANCE_MISMATCH']
          const budgetField = value => /^(status|originalDeadlineAt|wallDeadlineAt|childDeadlineAt|newReservation|releaseGranted|resources\.length|resources\.[0-9]{1,2}\.(resourceId|unit|limit|used|remaining|overdrawn|chargeCount))$/.test(value)
          const httpStatus = value => Number.isInteger(value) && value >= 100 && value <= 599 ? value : null
          const member = (values, value) => values.includes(value) ? value : null
          const count = value => Number.isSafeInteger(value) && value >= 0 ? value : null
          const workStatus = value => member(['received', 'understanding', 'planning', 'ready', 'actionable', 'awaiting_approval',
            'executing', 'completed', 'failed', 'recovery', 'waiting', 'blocked', 'cancelled'], value)
          const ownerCutNames = ['beforeMount', 'open', 'afterOracle', 'initialPanels', 'firstReload', 'secondReload',
            'afterRead', 'beforeOpen', 'reloaded', 'beforeOffline', 'afterReconnect']
          const ownerCut = cut => ({
            work: workStatus(cut.work),
            programme: member(['QUEUED', 'RUNNING', 'WAITING', 'PARTIAL', 'OBSERVED', 'TESTED', 'INVALIDATED',
              'FAILED', 'CANCELLED', 'UNKNOWN', 'CHECK_REJECTED'], cut.programme),
            occupation: member(['PROGRESS', 'WAITING', 'BLOCKED', 'STOPPED', 'RECONCILING', 'FAILED', 'COMPLETE'], cut.occupation),
            charges: (cut.charges ?? []).slice(0, 24).map(row => ({
              schema: member(['finnor.s5.institution-consumption.v1', 'finnor.s5.application-resource-charge.v1',
                'finnor.s5.governed-resource-charge.v1'], row.schema),
              phase: member(['EXECUTION', 'RECOVERY', 'HUMAN', 'ACQUISITION', 'CHECK', 'COMPILE', 'PREPARATION',
                'CONTROL', 'LIFECYCLE'], row.phase),
              operation: member(['institution-sources', 'institution-read', 'institution-status', 'institution-witness',
                'institution-mandate', 'institution-register-source', 'institution-submit', 'institution-cancel',
                'institution-resume', 'institution-revise', 'institution-inputs', 'institution-consent'], row.operation),
              count: count(row.count), since: count(row.since), units: count(row.units),
            })),
            transitions: (cut.transitions ?? []).slice(0, 12).map(row => ({
              type: member(['programme_occupation_reconciled', 'objective_loop_reconciled', 'children_reconciled',
                'work_received', 'work_status_changed'], row.type), from: workStatus(row.from), to: workStatus(row.to),
            })),
            jobs: (cut.jobs ?? []).slice(0, 24).map(row => ({
              type: member(['run_x1_institution_compiler_v1', 'run_harness_program_v1', 'run_x1_institution_continuation_v1',
                'run_application_semantics_v1'], row.type),
              status: member(['queued', 'running', 'quarantined'], row.status),
              currentGeneration: row.current_generation === true, due: row.due === true, count: count(row.count),
            })),
          })
          const renderBoundary = value => value && typeof value === 'object' ? {
            ...Object.fromEntries(['diagnosticUnavailable', 'canvasPresent', 'documentPresent', 'invalidDocument',
              'emptyDocument', 'threadResponseObserved', 'workResponseObserved', 'projectionResponseObserved']
              .map(key => [key, value[key] === true])),
            ...Object.fromEntries(['sourceErrors', 'workInstruments', 'unsupportedInstruments']
              .map(key => [key, Number.isSafeInteger(value[key]) && value[key] >= 0 ? value[key] : null])),
            composition: { attempted: value.composition?.attempted === true, valid: value.composition?.valid === true,
              workBlockPresent: value.composition?.workBlockPresent === true,
              errorType: ['ZodError', 'TypeError', 'ReferenceError', 'Error'].includes(value.composition?.errorType)
                ? value.composition.errorType : null,
              issues: (value.composition?.issues ?? []).slice(0, 20).map(issue => ({
                code: /^[a-z_]{3,60}$/.test(issue.code ?? '') ? issue.code : null,
                path: /^[a-zA-Z0-9_.]{1,180}$/.test(issue.path ?? '') ? issue.path : null })) },
            responseReadFailures: (value.responseReadFailures ?? []).filter(code => ['RESPONSE_BYTE_BOUND', 'RESPONSE_UNREADABLE'].includes(code)).slice(0, 10),
            applicationBoundary: value.applicationBoundary ? {
              ...Object.fromEntries(['workMatches', 'sessionPresent', 'busy', 'visible', 'online']
                .map(key => [key, value.applicationBoundary[key] === true])),
              codes: (value.applicationBoundary.codes ?? []).filter(code => ['AUTH_PENDING', 'SIGNED_OUT',
                'AUTH_UNVERIFIED', 'ENVIRONMENT_UNAVAILABLE', 'NATIVE_SCOPE_PENDING', 'NATIVE_SCOPE_READING',
                'READ_INTERRUPTED', 'ACCESS_UNAVAILABLE', 'PROJECTION_UNVERIFIED', 'ENVIRONMENT_CHANGED',
                'OWNER_CHANGED', 'READ_READY', 'NO_SESSIONS'].includes(code)).slice(0, 13),
            } : null,
            sourceRequests: (value.sourceRequests ?? []).filter(row => ['WORK', 'THREAD', 'COMPANY_PROJECTION',
              'APPLICATION_PROJECTION', 'ME'].includes(row.route))
              .slice(-30).map(row => ({ route: row.route, status: httpStatus(row.status), failed: row.failed === true,
                ageMs: Number.isSafeInteger(row.ageMs) && row.ageMs >= 0 && row.ageMs <= 3600000 ? row.ageMs : null })),
          } : null
          for (const { id, outcome, error, reason, checks, observations, wallMs } of mountedCases) {
            const browserOperation = typeof error === 'string'
              ? error.match(/^(browserType\.launch|browser\.newContext|page\.(?:goto|reload|waitForResponse|evaluate)|locator\.(?:fill|click|evaluate|waitFor)):/)?.[1] ?? null : null
            const probeCause = typeof error === 'string'
              ? error.match(/^Z0_BROWSER_CANVAS_PROJECTION_UNOBSERVABLE:([A-Z_]+)$/)?.[1] : undefined
            const networkError = typeof error === 'string' ? error.match(/net::(ERR_[A-Z_]{3,80})/)?.[1] ?? null : null
            const setupFailure = id === 'M-00' ? error : checks.find(check => check.id === 'B.setup' && !check.pass)?.observed
            const setupPredicate = typeof setupFailure === 'string' ? predicateFrom(setupFailure.replace(/^B:/, '')) : null
            const setupCause = typeof setupFailure === 'string'
              ? setupFailure.match(/^(?:B:)?Z0_FIXTURE_TERMINAL_(?:COMPILER|PROGRAMME|SESSION)_[A-Z_]+:([A-Z0-9_]{3,160})(?=[: ]|$)/)?.[1] ?? null : null
            const revocation = checks.find(check => check.id === 'B.revocation.race')?.observed
            const oracle = observations?.oracle
            const baseline = checks.find(check => check.id === 'A.canonical-work-baseline')?.observed
            const rootCarriedBy = ['THREAD_PERSISTED_ROOT', 'ROOT_URL_PARAMETER'].includes(observations?.rootCarriedBy)
              ? observations.rootCarriedBy : null
            results.push({ id, outcome, predicate: predicateFrom(error) ?? predicateFrom(reason),
              renderBoundary: renderBoundary(observations?.renderBoundary),
              originalIdentities: id === 'M-01' ? Object.fromEntries(['programId', 'compilerRequestId', 'responsibilityIdentity', 'reservationId', 'originalWorkInputId']
                .map(key => [key, checks.find(check => check.id === '2.original-identities')?.observed?.[key] === true])) : null,
              originalWorkState: id === 'M-02' ? Object.fromEntries(['before', 'after']
                .map(key => [key, identifier(checks.find(check => check.id === '6.original-completion-owner')?.observed?.[key])])) : null,
              canonicalBaseline: baseline ? { http: httpStatus(baseline.http), idMatches: baseline.idMatches === true,
                api: workStatus(baseline.api), sql: workStatus(baseline.sql) } : null,
              ownerBudgetDifferences: (observations?.ownerBudgetDifferences ?? []).filter(budgetField),
              budgetCutChecks: observations?.budgetCutChecks ? Object.fromEntries(budgetCuts
                .filter(key => key in observations.budgetCutChecks)
                .map(key => [key, member(budgetCutResults, observations.budgetCutChecks[key])])) : null,
              browserOperation, browserProbeCause: browserProbeCauses.has(probeCause) ? probeCause : null,
              networkError, setupPredicate, setupCause,
              revocation: revocation ? {
                raceReached: revocation.raceReached === true,
                requestsObserved: count(revocation.requestsObserved),
                settledRequests: count(revocation.settledRequests),
                unresolvedRequests: count(revocation.unresolvedRequests),
                revokedAccounts: count(revocation.revokedAccounts),
                expectedAccounts: count(revocation.expectedAccounts),
                status: typedCode(revocation.final?.status), reason: typedCode(revocation.final?.reason),
                requestsAfter: count(revocation.requestsAfter), loginsAfter: count(revocation.loginsAfter),
                programmeUnchanged: revocation.programmeUnchanged === true,
              } : null,
              wallMs: Number.isSafeInteger(wallMs) && wallMs >= 0 ? wallMs : null,
              browserStage: browserStages.has(observations?.browserStage) ? observations.browserStage : null,
              ownerCuts: observations?.ownerCuts ? Object.fromEntries(ownerCutNames
                .filter(name => observations.ownerCuts[name]).map(name => [name, ownerCut(observations.ownerCuts[name])])) : null,
              foreignHttp: observations?.foreignHttp ? { projection: httpStatus(observations.foreignHttp.projection),
                work: httpStatus(observations.foreignHttp.work), tenantDiffers: observations.foreignHttp.tenantDiffers === true } : null,
              institutionRequests: observations?.institutionRequests?.slice(-24).map(row => ({
                operation: member(['institution-sources', 'institution-read', 'institution-status'], row.operation),
                status: httpStatus(row.status), failed: row.failed === true,
              })) ?? null,
              logoutRequests: observations?.logoutRequests?.slice(0, 24).map(row => ({
                kind: member(['auth-token', 'auth-logout', 'sign-out', 'me', 'application-projection', 'institution-sources',
                  'institution-read'], row.kind),
                status: httpStatus(row.status), failed: row.failed === true,
              })) ?? null,
              reloadDifferences: (observations?.reloadDifferences ?? []).filter(field => reloadFields.has(field)),
              reloadBudget: observations?.reloadBudget
                ? Object.fromEntries(budgetChecks.map(key => [key, observations.reloadBudget[key] === true])) : null,
              rootCarriedBy, reloadsSettled: [0, 1, 2].includes(observations?.reloadsSettled) ? observations.reloadsSettled : null,
              oracle: oracle ? { projectionStatus: httpStatus(oracle.projectionStatus),
                institutionReadStatus: httpStatus(oracle.institutionReadStatus),
                projectedSessionFound: oracle.projectedSessionFound === true,
                disagreements: (oracle.disagreements ?? []).filter(field => oracleFields.has(field)),
              } : null,
              failedChecks: checks.filter(check => !check.pass).map(check => check.id)
                .filter(check => /^[a-zA-Z0-9_.-]{1,80}$/.test(check)) })
          }
          const economicCase = join(process.env.RUNNER_TEMP, 'z0-economic', 'cases', 'E-canonical-query-preserves-original-Work.json')
          if (existsSync(economicCase)) {
            const { status, observed, error } = JSON.parse(readFileSync(economicCase, 'utf8'))
            results.push({ id: 'D1-02a', outcome: status === 'PASS' && observed?.canonicalReadDidNotSteerOrCompleteWork === true ? 'PASS' : 'FAIL',
              predicate: predicateFrom(error) })
          }
          const appState = join(state, 'native-app-state.json')
          const app = existsSync(appState) ? JSON.parse(readFileSync(appState, 'utf8')) : null
          const setupLabel = value => typeof value === 'string' && /^[a-zA-Z0-9_.-]{1,80}$/.test(value) ? value : null
          const launcher = app ? { status: typedCode(app.status), reason: typedCode(app.reason), failure: typedCode(app.failureCode),
            stage: setupLabel(app.stage), buildStage: typedCode(app.productionBuild?.stage),
            steps: (Array.isArray(app.steps) ? app.steps : []).slice(0, 32).map(step => ({ label: setupLabel(step.label),
              code: Number.isInteger(step.code) && step.code >= 0 && step.code <= 255 ? step.code : null,
              signal: ['SIGTERM', 'SIGKILL', 'SIGABRT', 'SIGSEGV', 'SPAWN_ERROR'].includes(step.signal) ? step.signal : null })) } : null
          const apiLog = join(state, 'api-01.private.log')
          const serverErrorKinds = new Set()
          const retainErrorKind = value => {
            if (typeof value !== 'string') return
            const kind = typedCode(value) ?? sqlIdentifier(value)
            if (kind) serverErrorKinds.add(kind)
          }
          if (existsSync(apiLog)) {
            for (const entry of readFileSync(apiLog, 'utf8').split('\n')) {
              const line = entry.replace(/\x1b\[[0-9;]*m/g, '')
              const pretty = line.match(/^\s*(?:err|cause):\s*"(.*)"\s*$/)
              if (pretty) {
                retainErrorKind(pretty[1].replace(/\\"/g, '"'))
                continue
              }
              if (!line.includes('unhandled route failure') && !line.includes('[route-error]')) continue
              try {
                const { err, cause } = JSON.parse(line.slice(line.indexOf('{')))
                retainErrorKind(err)
                retainErrorKind(cause)
              } catch {}
            }
          }
          const receipt = { sourceSha: process.env.GITHUB_SHA, results, acquisitionFailure, fixtureFailures, launcher, serverErrorKinds: [...serverErrorKinds] }
          writeFileSync(join(process.env.RUNNER_TEMP, 'z0-cases.json'), JSON.stringify(receipt, null, 2) + '\n')
          const continuation = ['P0-00', 'P0-01', 'P0-10', 'P0-11']
          const recovery = {
            kill: ['P1-03'],
            revoke: ['P1-05'],
            'revoked-accept': ['B-REVOKE-ACCEPT'],
            'revoked-use': ['B-REVOKE-USE'],
            boundaries: ['B-REVOKE-CLAIM', 'B-KILL-CLAIM', 'B-KILL-ACCEPT'],
          }
          const recoveryMode = process.env.Z0_RECOVERY_MODE
          const recoveryRequired = recoveryMode.startsWith('current-')
            ? ['CUR-' + recoveryMode.slice(8).toUpperCase()]
            : recovery[recoveryMode]
          const required = ({
            'codex/project-z0-identity': ['D1-00', 'D1-B', 'D1-01'],
            'codex/project-z0-economic': ['D1-02a'],
            'codex/project-z0-confidential': ['D1-03a'],
            'codex/project-z0-useful': [...continuation, 'P0-11b'],
            'codex/project-z0-r12': ['R12-02', 'R12-03', 'R12-04'],
            'codex/project-z0-mounted': Array.from({ length: 11 }, (_, index) => 'M-' + String(index).padStart(2, '0')),
            'codex/zw-integration-quality-20261115': Array.from({ length: 11 }, (_, index) => 'M-' + String(index).padStart(2, '0')),
            'codex/zw-release-proof-20261121': Array.from({ length: 11 }, (_, index) => 'M-' + String(index).padStart(2, '0')),
            'codex/project-z0-recovery': recoveryRequired,
          })[process.env.GITHUB_REF_NAME] ?? continuation
          const mountedCaseTitles = {
            "M-00": "Prepare authenticated native Work and worker",
            "M-01": "Show original Work, terms and remaining resources",
            "M-02": "Show accounting and independently observed completion",
            "M-03": "Distinguish supported facts from predictions",
            "M-04": "Keep blocked or needs-action state after reload",
            "M-05": "Switch Works through Investigations",
            "M-06": "Switch user and protect private Work",
            "M-07": "Refresh the authentication token",
            "M-08": "Sign out and sign back in",
            "M-09": "Recover after losing the connection",
            "M-10": "Reject a delayed response from the previous user"
          }
          if (process.env.GITHUB_STEP_SUMMARY) {
            const lines = ['## Z0 - Work display and session journey', '', '| Product behavior | Result |', '| --- | --- |']
            for (const id of required) {
              const observed = results.find(entry => entry.id === id)?.outcome
              const outcome = ['PASS', 'FAIL', 'NOT_RUN'].includes(observed) ? observed : 'MISSING'
              lines.push('| ' + id + ' - ' + (mountedCaseTitles[id] ?? 'Registered native case') + ' | ' + outcome + ' |')
            }
            lines.push('', 'These results cover this native journey. Overall Z/W completion also requires the remaining phase acceptance evidence.')
            writeFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n', { flag: 'a' })
          }
          for (const id of required) {
            const result = results.find(entry => entry.id === id)
            if (result?.outcome !== 'PASS') {
              console.error(id, result?.outcome ?? 'MISSING', result?.predicate ?? '', result?.httpStatus ?? '', result?.responseCode ?? '')
              process.exitCode = 1
            }
          }
