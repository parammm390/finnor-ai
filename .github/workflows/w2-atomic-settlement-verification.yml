name: W2 atomic settlement isolated owner verification
on:
  push:
    branches:
      - codex/w2-atomic-closing-settlement-20261114
      - codex/w2-cut-section-diagnostics-20261114
      - codex/zw-integration-quality-20261115
permissions:
  contents: read
jobs:
  verdict:
    name: w2-pair-verdict
    needs: [exact, controls]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require the exact owner and all four original controls
        env:
          EXACT: ${{ needs.exact.result }}
          CONTROLS: ${{ needs.controls.result }}
        run: test "$EXACT" = success && test "$CONTROLS" = success
  completion-receipt:
    needs: verdict
    if: ${{ always() && github.ref_name == 'codex/zw-integration-quality-20261115' }}
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/ci-completion.yml
    with:
      pr_number: 187
      head_sha: ${{ github.sha }}
      gate: w2-pair-verdict
      result: ${{ needs.verdict.result }}
  exact:
    uses: ./.github/workflows/w2-compensation-episode.yml
    with:
      episode: after-exact
  controls:
    needs: exact
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        episode:
          - before-exact
          - after-wrong-amount
          - after-wrong-payee
          - after-wrong-receipt
    uses: ./.github/workflows/w2-compensation-episode.yml
    with:
      episode: ${{ matrix.episode }}
