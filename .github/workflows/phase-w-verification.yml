name: Phase W NativeControlledDEV and separate W3 qualification
on:
  push:
    branches: [main]
  workflow_call:
  pull_request:
    paths:
      - .github/workflows/**
      - finnor-os/**
      - packages/**
      - scripts/**
      - src/**
      - app/**
      - components/**
      - public/**
      - styles/**
      - scope-postz/**
      - scope-frontier5/x1-institutional-programme-compiler/verification-plan.json
      - package.json
      - package-lock.json
      - next.config.*
      - postcss.config.*
      - tailwind.config.*
      - tsconfig*.json
      - vendor/**
permissions:
  contents: read
concurrency:
  group: phase-w-native-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source-checks:
    name: "Verify integrated source contracts"
    uses: ./.github/workflows/source-checks.yml
  ci-boundary-controls:
    name: "Reject damaged verification boundaries"
    needs: source-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        timeout-minutes: 5
        with:
          node-version: 22.22.3
      - name: Acquire exact root dependencies
        timeout-minutes: 5
        run: npm ci --no-audit --no-fund
      - name: Require actual Phase W boundary controls
        timeout-minutes: 4
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          timeout --signal=TERM --kill-after=30s 180s node --max-old-space-size=256 scope-postz/phase-w-ci/check-ci-boundaries.mjs --source "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/phase-w-ci-boundaries"
      - name: Check exact source preservation after boundary controls
        if: ${{ always() }}
        timeout-minutes: 1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Retain only the fixed fixture-control result
        if: ${{ always() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase-w-ci-boundaries-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phase-w-ci-boundaries/report.json
          if-no-files-found: error
          retention-days: 7
  w1-native-positive:
    name: "Verify W1 native orchestration"
    uses: ./.github/workflows/w1-owning-episode.yml
    with:
      mode: native
  w1-owning-regressions:
    name: "Verify W1 adverse owner controls"
    needs: w1-native-positive
    strategy:
      fail-fast: false
      matrix:
        mode: [abc, internal-read-standing, internal-pressure, internal-revocation, internal-sequential, internal-drift]
    uses: ./.github/workflows/w1-owning-episode.yml
    with:
      mode: ${{ matrix.mode }}
  w2-compensation-positive:
    name: "Verify exact W2 settlement"
    uses: ./.github/workflows/w2-compensation-episode.yml
    with:
      episode: after-exact
  w2-compensation-controls:
    name: "Reject invalid W2 settlement evidence"
    needs: w2-compensation-positive
    strategy:
      fail-fast: false
      matrix:
        episode: [before-exact, after-wrong-amount, after-wrong-payee, after-wrong-receipt]
    uses: ./.github/workflows/w2-compensation-episode.yml
    with:
      episode: ${{ matrix.episode }}
      checked_source_sha: ${{ needs.w2-compensation-positive.outputs.checked_source_sha }}
  w3-fast-owner:
    name: "Verify W3 fast owner journey"
    uses: ./.github/workflows/w3-owning-episode.yml
    with:
      episode: fast
  w3-native-and-publication:
    name: "Verify W3 fulfillment and publication"
    needs: w3-fast-owner
    strategy:
      fail-fast: false
      matrix:
        episode: [native, publication]
    uses: ./.github/workflows/w3-owning-episode.yml
    with:
      episode: ${{ matrix.episode }}
      checked_source_sha: ${{ needs.w3-fast-owner.outputs.checked_source_sha }}
  combined-native-owners:
    name: "Verify combined company owner journey"
    needs: [source-checks, ci-boundary-controls, w1-owning-regressions, w2-compensation-controls, w3-native-and-publication]
    uses: ./.github/workflows/phase-w-native-episode.yml
  w3-only-installed-headed-cold:
    name: "Verify W3 installed browser journey"
    needs: w3-native-and-publication
    uses: ./.github/workflows/w3-owning-qualification.yml
  native-controlled-dev:
    name: NativeControlledDEV, not Phase W release
    needs: [source-checks, ci-boundary-controls, w1-native-positive, w1-owning-regressions, w2-compensation-positive, w2-compensation-controls, w3-fast-owner, w3-native-and-publication, combined-native-owners]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every registered native owner result
        env:
          SOURCE_RESULT: ${{ needs.source-checks.result }}
          CI_BOUNDARIES: ${{ needs.ci-boundary-controls.result }}
          W1_POSITIVE: ${{ needs.w1-native-positive.result }}
          W1_REGRESSIONS: ${{ needs.w1-owning-regressions.result }}
          W2_POSITIVE: ${{ needs.w2-compensation-positive.result }}
          W2_CONTROLS: ${{ needs.w2-compensation-controls.result }}
          W3_FAST: ${{ needs.w3-fast-owner.result }}
          W3_NATIVE: ${{ needs.w3-native-and-publication.result }}
          COMBINED_NATIVE: ${{ needs.combined-native-owners.result }}
        run: |
          set -euo pipefail
          for result in "$SOURCE_RESULT" "$CI_BOUNDARIES" "$W1_POSITIVE" "$W1_REGRESSIONS" "$W2_POSITIVE" "$W2_CONTROLS" "$W3_FAST" "$W3_NATIVE" "$COMBINED_NATIVE"; do
            test "$result" = success
          done
          printf 'NativeControlledDEV passed for %s. PHASE_W_RELEASE_BLOCKED. W3-only installed qualification is separate and does not qualify W4/W5.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
