name: "Security - Secrets and vulnerable dependencies"
on:
  push:
    branches: [codex/zw-security-range-20261123]
  workflow_call:
    inputs:
      run_dependency_scan:
        description: Run OSV for dependency-affecting changes
        required: false
        type: boolean
        default: true
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  gitleaks:
    name: "Secrets - Scan complete Git history"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # One pinned scanner covers the complete history, including side parents
      # and each merge parent; the overlapping first-page action is unnecessary.
      - name: Scan complete base-to-head history
        id: secret-history
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          fail() { printf '::error::%s\n' "$1"; exit 1; }
          export GIT_NO_LAZY_FETCH=1
          version=8.24.3
          archive="gitleaks_${version}_linux_x64.tar.gz"
          checksum=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          tooling="$(mktemp -d "${RUNNER_TEMP}/finnor-gitleaks.XXXXXX")" || fail "Cannot create scanner tooling directory"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" \
            --output "${tooling}/${archive}" || fail "Cannot acquire pinned scanner"
          printf '%s  %s\n' "$checksum" "${tooling}/${archive}" | sha256sum --check --strict - \
            || fail "Scanner archive checksum mismatch"
          tar -xzf "${tooling}/${archive}" -C "$tooling" gitleaks || fail "Cannot extract verified scanner"
          scanner="${tooling}/gitleaks"
          [[ "$("$scanner" version)" == "$version" ]] || fail "Scanner version mismatch"
          printf 'gitleaks=%s\n' "$scanner" >> "$GITHUB_OUTPUT"
          : > "${tooling}/no-ignore-file"

          if [[ -n "$PR_BASE_SHA" || -n "$PR_HEAD_SHA" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            base="$PUSH_BASE_SHA"
            head="$HEAD_SHA"
          else
            echo "::error::No auditable base-to-head history for this event"
            exit 1
          fi
          [[ "$base" =~ ^[0-9a-f]{40}$ && "$head" =~ ^[0-9a-f]{40}$ ]] || fail "Invalid or missing history endpoints"
          [[ "$(git rev-parse --is-shallow-repository)" == "false" ]] || fail "Incomplete shallow history"
          git cat-file -e "${head}^{commit}" || fail "Head commit is unavailable"
          if [[ "$base" == "0000000000000000000000000000000000000000" && "$EVENT_NAME" == "push" ]]; then
            scan_range="$head"
          else
            git cat-file -e "${base}^{commit}" || fail "Base commit is unavailable"
            scan_range="${base}..${head}"
          fi
          [[ "$(git rev-parse HEAD)" == "$head" ]] || fail "Checkout does not match the scanned head"
          git rev-list "$scan_range" > "${tooling}/commits.txt" || fail "Cannot enumerate complete history"
          count="$(wc -l < "${tooling}/commits.txt")"
          [[ "$count" -gt 0 ]] || fail "History range contains no auditable commits"
          printf 'Complete history range: %s; reachable commits: %s\n' "$scan_range" "$count"
          "$scanner" git . --config=.gitleaks.toml --redact=100 --no-banner \
            --ignore-gitleaks-allow --gitleaks-ignore-path="${tooling}/no-ignore-file" \
            --report-format=json --report-path="${RUNNER_TEMP}/finnor-secret-history-redacted.json" \
            --log-opts="-m ${scan_range}"
      - name: Verify exact exceptions and adversarial history controls
        if: ${{ always() && steps.secret-history.outputs.gitleaks != '' }}
        env:
          GITLEAKS_BIN: ${{ steps.secret-history.outputs.gitleaks }}
          GIT_AUTHOR_NAME: FINNOR scanner fixture
          GIT_AUTHOR_EMAIL: fixture@example.invalid
          GIT_COMMITTER_NAME: FINNOR scanner fixture
          GIT_COMMITTER_EMAIL: fixture@example.invalid
        run: node scripts/centropy/verify-secret-scan-policy.mjs "$GITLEAKS_BIN" "$RUNNER_TEMP/finnor-secret-policy-proof.json"
      - name: Retain redacted complete-history findings
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: secret-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/finnor-secret-history-redacted.json
            ${{ runner.temp }}/finnor-secret-policy-proof.json
          if-no-files-found: warn
          retention-days: 7
  osv:
    name: "Dependencies - Scan known vulnerabilities"
    if: ${{ github.event_name == 'push' || inputs.run_dependency_scan }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Scan declared dependency locks with OSV 2.3.8
        id: scan
        run: |
          set -euo pipefail
          scanner="$RUNNER_TEMP/osv-scanner"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            https://github.com/google/osv-scanner/releases/download/v2.3.8/osv-scanner_linux_amd64 \
            --output "$scanner"
          printf '%s  %s\n' bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc "$scanner" \
            | sha256sum --check --strict
          chmod 700 "$scanner"
          status=0
          # Every Python input here is an exact version closure. Scan those
          # pins directly so a remote resolver cannot omit a lock from the run.
          "$scanner" scan source --no-resolve --format=json --output-file=osv-results.json \
            --lockfile=package-lock.json \
            --lockfile=finnor-os/package-lock.json \
            --lockfile=finnor-os/apps/supplier-canary/package-lock.json \
            --lockfile=finnor-os/packages/epistemic-runtime/native/z4-execution-proof/Cargo.lock \
            --lockfile=requirements.txt:finnor-os/packages/epistemic-runtime/src/requirements-s5.txt \
            --lockfile=requirements.txt:finnor-os/packages/epistemic-runtime/src/intervention-requirements.txt \
            --lockfile=requirements.txt:finnor-os/scripts/r3/requirements.lock \
            --lockfile=requirements.txt:finnor-os/scripts/r3/upstream-requirements.lock \
            --lockfile=requirements.txt:finnor-os/scripts/r4/requirements.lock \
            --lockfile=requirements.txt:finnor-os/scripts/r4/numerical-requirements.lock \
            --lockfile=requirements.txt:finnor-os/scripts/postz/w3/requirements-s3.lock || status=$?
          if [[ "$status" != 0 && "$status" != 1 ]]; then
            echo "::error::OSV scanner failed with exit $status"
            exit 1
          fi
          test -s osv-results.json
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
      - name: Enforce dependency findings
        env:
          OSV_SCANNER_STATUS: ${{ steps.scan.outputs.status }}
        run: node scripts/release/verify-dependency-scan.mjs osv-results.json osv-sarif-input.json
      - name: Render complete findings for GitHub Code Scanning
        id: sarif
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        uses: google/osv-scanner-action/osv-reporter-action@8dc09193bb540e09b23da07ad7e30bd33bf87018
        with:
          scan-args: |-
            --output=osv-results.sarif
            --new=osv-sarif-input.json
            --gh-annotations=false
            --fail-on-vuln=false
      - name: Upload complete findings to Code Scanning
        if: ${{ !cancelled() && steps.sarif.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@cdefb33c0f6224e58673d9004f47f7cb3e328b89
        with:
          sarif_file: osv-results.sarif
      - name: Retain full OSV evidence
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            osv-results.json
            osv-results.sarif
          if-no-files-found: error
          retention-days: 7
