name: security
on:
  workflow_call:
    inputs:
      run_dependency_scan:
        description: Run OSV for dependency-affecting changes
        required: false
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ["package.json", "package-lock.json", "finnor-os/**", ".github/workflows/security.yml"]
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  osv:
    name: osv-scanner
    if: ${{ github.event_name == 'push' || inputs.run_dependency_scan }}
    # v2 ships reusable workflows, not a root action.yml. Calling the root as an
    # action makes GitHub reject it before the dependency scan begins.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc
    with:
      scan-args: |-
        --lockfile=package-lock.json
        --lockfile=finnor-os/package-lock.json
