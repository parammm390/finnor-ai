name: security
on:
  pull_request:
    paths: ["package.json", "package-lock.json", "finnor-os/**", ".github/workflows/security.yml"]
  push:
    branches: [main]
    paths: ["package.json", "package-lock.json", "finnor-os/**", ".github/workflows/security.yml"]
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  osv:
    name: osv-scanner
    # v2 ships reusable workflows, not a root action.yml. Calling the root as an
    # action makes GitHub reject it before the dependency scan begins.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      scan-args: |-
        --lockfile=package-lock.json
        --lockfile=finnor-os/package-lock.json
