name: tenant-isolation-nightly
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tenant-isolation-nightly
  cancel-in-progress: false
jobs:
  database-role-qa:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: finnor-os
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finnor
          POSTGRES_PASSWORD: finnor
          POSTGRES_DB: finnor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finnor" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: finnor-os/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Verify release truth without production credentials
        working-directory: .
        run: npm run release:truth && npm run test:release
      - name: Verify independent roles and actual queue and routing consumers
        env:
          DATABASE_URL: postgres://finnor:finnor@localhost:5432/finnor
          FINNOR_PRODUCTION_PREFLIGHT_EVIDENCE_DIR: ${{ runner.temp }}/runtime-database-role-evidence
        run: >-
          npm test -- --run tests/integration/runtime-database-role-isolation.test.ts
          tests/integration/production-database-admission.test.ts
          tests/integration/queue.test.ts tests/integration/scope3-compute-plane.test.ts
          tests/integration/setup-status-phone-routing.test.ts
          tests/integration/vapi-webhook-identity.test.ts
          tests/integration/vapi-status-update-notify.test.ts
      - name: Retain role and consumer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-database-role-isolation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-database-role-evidence/*
          if-no-files-found: warn
          retention-days: 7
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: finnor-os
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: finnor-os/package-lock.json
      - run: npm ci
      - name: Probe production and staging PE tenant isolation
        env:
          STAGING_API_URL: ${{ secrets.TENANT_PROBE_STAGING_API_URL }}
          PRODUCTION_API_URL: ${{ secrets.TENANT_PROBE_PRODUCTION_API_URL }}
          TENANT_A_PROBE_JWT: ${{ secrets.TENANT_PROBE_A_JWT }}
          TENANT_B_PROBE_JWT: ${{ secrets.TENANT_PROBE_B_JWT }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.TENANT_PROBE_VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx tsx scripts/probe-tenant-isolation.ts