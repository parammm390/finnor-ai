name: tenant-isolation-nightly
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tenant-isolation-nightly
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: finnor-os
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: finnor-os/package-lock.json
      - run: npm ci
      - name: Probe production and staging PE tenant isolation
        env:
          STAGING_API_URL: ${{ secrets.TENANT_PROBE_STAGING_API_URL }}
          PRODUCTION_API_URL: ${{ secrets.TENANT_PROBE_PRODUCTION_API_URL }}
          TENANT_A_PROBE_JWT: ${{ secrets.TENANT_PROBE_A_JWT }}
          TENANT_B_PROBE_JWT: ${{ secrets.TENANT_PROBE_B_JWT }}
          PRODUCTION_TENANT_A_MARKER_ROOT_REF: ${{ secrets.TENANT_PROBE_PRODUCTION_MARKER_ROOT_REF }}
          STAGING_TENANT_A_MARKER_ROOT_REF: ${{ secrets.TENANT_PROBE_STAGING_MARKER_ROOT_REF }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.TENANT_PROBE_VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx tsx scripts/probe-tenant-isolation.ts --out "$RUNNER_TEMP/tenant-isolation"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: tenant-isolation-probe
          path: ${{ runner.temp }}/tenant-isolation
