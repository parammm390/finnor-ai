name: k6 nightly lite
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finnor-os
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065
      - name: Run the configured staging load probe
        env:
          BASE_URL: ${{ secrets.K6_STAGING_BASE_URL }}
          TENANT_ID: ${{ secrets.K6_STAGING_TENANT_ID }}
          AUTH_BEARER_TOKEN: ${{ secrets.K6_STAGING_AUTH_BEARER_TOKEN }}
          MARKETING_WEBHOOK_SECRET: ${{ secrets.K6_STAGING_MARKETING_WEBHOOK_SECRET }}
          VERCEL_BYPASS_SECRET: ${{ secrets.K6_STAGING_VERCEL_BYPASS_SECRET }}
          INBOX_RATE: "5"
          READ_VUS: "20"
          APPROVAL_RATE: "5"
          LOAD_DURATION: "60s"
        run: |
          test -n "$BASE_URL" -a -n "$TENANT_ID" -a -n "$AUTH_BEARER_TOKEN" -a -n "$MARKETING_WEBHOOK_SECRET"
          k6 run --summary-export k6-nightly-lite-summary.json scripts/k6-load-test.js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: k6-nightly-lite-summary
          path: finnor-os/k6-nightly-lite-summary.json
