      - name: Deploy or resume governed four-class AWS compute plane
        run: |
          set -euo pipefail
          deploy_stage() {
            node scripts/release/deploy-aws-compute-plane.mjs \
              --stage="$1" \
              --preflight-evidence="$FINNOR_PREFLIGHT_EVIDENCE" \
              --database-env="$FINNOR_PROTECTED_DATABASE_ENV" \
              --image-digest="$FINNOR_ECR_IMAGE_DIGEST"
          }
          stage="$(aws cloudformation describe-stacks --stack-name finnor-production --query 'Stacks[0].Parameters[?ParameterKey==`ComputePlaneStage`].ParameterValue | [0]' --output text)"
          if test -z "$stage" -o "$stage" = "None"; then stage=legacy; fi
          case "$stage" in
            legacy) deploy_stage preparing; deploy_stage routing; deploy_stage finalized ;;
            preparing) deploy_stage routing; deploy_stage finalized ;;
            routing) deploy_stage finalized ;;
            finalized) deploy_stage rollout ;;
            *) echo "::error::unknown compute-plane stage $stage"; exit 1 ;;
          esac
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Clear ECS AWS credentials
        run: |
          echo "AWS_ACCESS_KEY_ID=" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=" >> "$GITHUB_ENV"
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""

      - name: Verify cross-runtime release and migration parity
        run: node scripts/release/verify-production-parity.mjs --database-env "$FINNOR_PROTECTED_DATABASE_ENV"
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          VERCEL_FRONTEND_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_FRONTEND_AUTOMATION_BYPASS_SECRET }}
          VERCEL_API_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_API_AUTOMATION_BYPASS_SECRET }}
          VERCEL_SUPPLIER_CANARY_APP_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_SUPPLIER_CANARY_APP_AUTOMATION_BYPASS_SECRET }}
          VERCEL_SUPPLIER_CANARY_AUTH_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_SUPPLIER_CANARY_AUTH_AUTOMATION_BYPASS_SECRET }}

      - name: Verify final PE product authority readiness
        run: |
          node scripts/release/verify-production-readiness.mjs "${{ steps.api.outputs.url }}" "$FINNOR_COMMIT_SHA" api
          node scripts/release/verify-production-readiness.mjs https://api-psi-brown-95.vercel.app "$FINNOR_COMMIT_SHA" api
          npm --prefix finnor-os run release:p8-runtime-contract -- --readiness-url https://api-psi-brown-95.vercel.app
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          VERCEL_API_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_API_AUTOMATION_BYPASS_SECRET }}
