name: production-release

on:
  push:
    branches: [main]

concurrency:
  group: finnor-production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  canonical-graph-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finnor
          POSTGRES_PASSWORD: finnor
          POSTGRES_DB: finnor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finnor" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgres://finnor:finnor@localhost:5432/finnor
      FINNOR_CHAOS_TEST_CONTEXT: "1"
      FINNOR_TEST_MANAGED_EXTENSIONS: omit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: finnor-os/package-lock.json

      - name: Install API/workspace dependencies
        run: npm ci
        working-directory: finnor-os

      - name: Verify migration bundle parity
        run: |
          npm run db:bundle
          git diff --exit-code packages/db/migrations-bundle.ts
        working-directory: finnor-os

      - name: Rehearse historical production database upgrade
        timeout-minutes: 5
        run: npx tsx scripts/release/rehearse-historical-upgrade.ts
        working-directory: finnor-os

      - name: Apply schema and checkpointer migrations
        run: |
          npm run db:migrate
          npm run setup:langgraph
        working-directory: finnor-os

      - name: Seed canonical Private Equity fixture
        run: npm run db:seed
        working-directory: finnor-os

      - name: Verify canonical traversal and tenant isolation
        run: npm test -- --run tests/integration/canonical-company-graph.test.ts tests/integration/tenant-isolation.test.ts
        working-directory: finnor-os

  phase5-readiness:
    needs: canonical-graph-gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finnor
          POSTGRES_PASSWORD: finnor
          POSTGRES_DB: finnor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finnor" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgres://finnor:finnor@localhost:5432/finnor
      FINNOR_CHAOS_TEST_CONTEXT: "1"
      FINNOR_TEST_MANAGED_EXTENSIONS: omit
      FINNOR_SCOPE2_FORCE_EMBEDDED: "1"
      FINNOR_RELEASE_SOURCE: github-actions
      NODE_ENV: test
      AUTH_DEV_BYPASS: "1"
      CERTIFICATION_SEED_ALLOWED: "1"
      CERTIFICATION_TEST_EMAILS: certification@example.invalid
      CERTIFICATION_TEST_PHONES: "+15550000001"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            finnor-os/package-lock.json
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Install API/workspace dependencies
        run: npm ci
        working-directory: finnor-os

      - name: Derive commit-locked release metadata
        run: |
          sha="$(git rev-parse HEAD)"
          short="${sha:0:12}"
          echo "RELEASE_COMMIT_SHA=$sha" >> "$GITHUB_ENV"
          echo "FINNOR_COMMIT_SHA=$sha" >> "$GITHUB_ENV"
          echo "FINNOR_BUILD_ID=finnor-$short" >> "$GITHUB_ENV"
          echo "FINNOR_VERSION=0.1.0+$short" >> "$GITHUB_ENV"

      - name: Verify clean canonical release source
        run: npm run release:verify
        env:
          FINNOR_ENVIRONMENT: production

      - name: Apply migrations from an empty database
        run: |
          npm run db:bundle
          git diff --exit-code packages/db/migrations-bundle.ts
          npm run db:migrate
          npm run setup:langgraph
        working-directory: finnor-os

      - name: Seed Phase 5 certification fixture
        run: npm run db:seed
        working-directory: finnor-os

      - name: Install disposable legacy fixture seam
        run: npx tsx scripts/install-vertical-fixture-seam.ts
        working-directory: finnor-os

      - name: Exact-SHA Phase 5 type and ownership gates
        run: |
          npm run openapi
          npm run typecheck
          npm run release:manifest
          npm run release:pe-domain-boundary
        working-directory: finnor-os

      - name: Phase-4 PE Digital Twin certification
        run: npm run release:scope4-digital-twin
        working-directory: finnor-os

      - name: Scope-5 epistemic impact certification
        run: npm run release:scope5-epistemic-impact
        working-directory: finnor-os

  root-release-gate:
    uses: ./.github/workflows/marketing-ci.yml

  post-merge-certification:
    name: post-merge-certification
    needs: [canonical-graph-gate, phase5-readiness, root-release-gate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Certify the exact merged SHA before production authority exists
        env:
          CANONICAL_RESULT: ${{ needs.canonical-graph-gate.result }}
          PHASE5_RESULT: ${{ needs.phase5-readiness.result }}
          ROOT_RESULT: ${{ needs.root-release-gate.result }}
        run: |
          test "$CANONICAL_RESULT" = success
          test "$PHASE5_RESULT" = success
          test "$ROOT_RESULT" = success
          printf '{"schema":"finnor-post-merge-certification.v1","sha":"%s","runId":"%s","runAttempt":"%s","result":"PASS"}\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: [post-merge-certification]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      id-token: write
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finnor
          POSTGRES_PASSWORD: finnor
          POSTGRES_DB: finnor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finnor" --health-interval 5s
          --health-timeout 5s --health-retries 10
    environment: production
    env:
      FINNOR_RELEASE_SOURCE: github-actions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            finnor-os/package-lock.json
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@50.15.1
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""

      - name: Install API/workspace dependencies
        run: npm ci
        working-directory: finnor-os
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""

      - name: Verify dependency manifests remain source-locked
        run: git diff --exit-code -- package.json package-lock.json finnor-os/package.json finnor-os/package-lock.json
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""

      - name: Validate canonical deployment truth
        run: node scripts/release/validate-deployment-truth.mjs
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""

      - name: Release governance regression tests
        run: |
          node --test scripts/release/release-policy.test.mjs scripts/release/compute-plane-policy.test.mjs
          node scripts/release/validate-production-mutation-inventory.mjs
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""

      - name: Derive commit-locked release metadata
        run: |
          sha="$(git rev-parse HEAD)"
          short="${sha:0:12}"
          echo "RELEASE_COMMIT_SHA=$sha" >> "$GITHUB_ENV"
          echo "FINNOR_COMMIT_SHA=$sha" >> "$GITHUB_ENV"
          echo "FINNOR_BUILD_ID=finnor-$short" >> "$GITHUB_ENV"
          echo "FINNOR_VERSION=0.1.0+$short" >> "$GITHUB_ENV"
          echo "FINNOR_ENVIRONMENT=production" >> "$GITHUB_ENV"
          region="$(node -e 'const c=require("./infra/deployment/production.contract.json"); process.stdout.write(c.topology.worker.region)')"
          echo "AWS_REGION=$region" >> "$GITHUB_ENV"
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""

      - name: Verify clean canonical Git source
        run: node scripts/release/verify-release.mjs
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""

      - name: Frontend quality gate
        run: |
          npm run lint
          npx tsc --noEmit -p tsconfig.json
          npm run test:unit
          npm run typecheck --prefix finnor-os
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""

      - name: API typecheck gate
        run: npm run typecheck
        working-directory: finnor-os
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""

      - name: Prepare disposable worker smoke database
        run: |
          npm run db:bundle
          git diff --exit-code -- packages/db/migrations-bundle.ts
          npm run db:migrate
          npm run setup:langgraph
        working-directory: finnor-os
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          DATABASE_URL: postgres://finnor:finnor@127.0.0.1:5432/finnor
          FINNOR_TEST_MANAGED_EXTENSIONS: omit

      - name: Build and smoke-test exact worker image without production credentials
        run: |
          set -euo pipefail
          image="finnor-worker:${FINNOR_COMMIT_SHA}"
          container_id=""
          cleanup() { if test -n "$container_id"; then docker rm -f "$container_id" >/dev/null 2>&1 || true; fi; }
          trap cleanup EXIT
          docker build --file finnor-os/Dockerfile.worker --tag "$image" finnor-os
          for attempt in $(seq 1 30); do
            pg_isready --host 127.0.0.1 --port 5432 --username finnor --dbname finnor && break
            sleep 2
          done
          pg_isready --host 127.0.0.1 --port 5432 --username finnor --dbname finnor
          supabase_url="$(node -e 'const fs=require("node:fs"); const contract=JSON.parse(fs.readFileSync("infra/deployment/production.contract.json","utf8")); process.stdout.write(contract.topology.database.supabaseUrl);')"
          container_id="$(docker run --detach --network host \
            --env NODE_ENV=test \
            --env FINNOR_ENVIRONMENT=production \
            --env FINNOR_RELEASE_SOURCE=github-actions \
            --env FINNOR_COMMIT_SHA="$FINNOR_COMMIT_SHA" \
            --env FINNOR_BUILD_ID="$FINNOR_BUILD_ID" \
            --env FINNOR_VERSION="$FINNOR_VERSION" \
            --env FINNOR_WORKER_DEPLOYMENT_ID=ecs:container-smoke \
            --env FINNOR_WORKLOAD_CLASS=REALTIME \
            --env FINNOR_WORKER_CAPABILITIES=jobs,realtime,sse \
            --env SECRETS_PROVIDER=env \
            --env DATABASE_URL=postgres://finnor:finnor@127.0.0.1:5432/finnor \
            --env POSTGRES_URL_NON_POOLING=postgres://finnor:finnor@127.0.0.1:5432/finnor \
            --env SUPABASE_URL="$supabase_url" \
            --env JARVIS_SSE_ALLOWED_ORIGINS=https://finnorai.com \
            --env WORKER_CONCURRENCY=2 \
            --env WORKER_INTERACTIVE_RESERVED_CONCURRENCY=0 \
            --env FINNOR_DB_POOL_MAX=1 \
            "$image")"
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8090/healthz | node -e 'const fs=require("node:fs"); const body=JSON.parse(fs.readFileSync(0,"utf8")); if(body.ok!==true || body.realtime!==true || body.release?.commitSha!==process.env.FINNOR_COMMIT_SHA || body.release?.buildId!==process.env.FINNOR_BUILD_ID || body.release?.version!==process.env.FINNOR_VERSION || !body.capabilities?.includes("jobs") || !body.capabilities?.includes("sse") || body.capabilities?.includes("orchestration")) process.exit(1)'; then ready=1; break; fi
            sleep 2
          done
          if test "$ready" != 1; then docker logs "$container_id" || true; echo "::error::worker container smoke test did not expose /healthz"; exit 1; fi
          docker stop --time 30 "$container_id" >/dev/null
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container_id")" = "0"
          container_id=""
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""

      - name: Verify product-runtime release policy without production credentials
        run: npm run release:p8-zero-resurrection
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""

      - name: Build commit-locked production artifacts before any database or AWS credential
        run: |
          node scripts/release/deploy-production.mjs frontend --prepare-only
          node scripts/release/deploy-production.mjs api --prepare-only
          node scripts/release/deploy-production.mjs supplierCanaryApp --prepare-only
          node scripts/release/deploy-production.mjs supplierCanaryAuth --prepare-only
          node scripts/release/verify-release.mjs
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Issue exact certified production mutation authorization
        run: |
          authorization="$RUNNER_TEMP/production-mutation-authorization.json"
          node scripts/release/production-mutation-guard.mjs issue --output "$authorization"
          echo "FINNOR_MUTATION_AUTHORIZATION=$authorization" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Authenticate exact AWS project with GitHub OIDC for ECR
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN || 'arn:aws:iam::601804670058:role/finnor-github-actions-deploy' }}
          aws-region: ${{ env.AWS_REGION }}
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["ecr:GetAuthorizationToken","ecr:BatchCheckLayerAvailability","ecr:BatchGetImage","ecr:CompleteLayerUpload","ecr:DescribeImages","ecr:DescribeRepositories","ecr:GetDownloadUrlForLayer","ecr:InitiateLayerUpload","ecr:PutImage","ecr:UploadLayerPart"],"Resource":"*"}]}

      - name: Publish or reuse exact worker image in ECR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          expected_account="$(node -e 'const c=require("./infra/deployment/production.contract.json"); process.stdout.write(c.topology.worker.accountId)')"
          expected_region="$(node -e 'const c=require("./infra/deployment/production.contract.json"); process.stdout.write(c.topology.worker.region)')"
          test "$account" = "$expected_account"
          test "$AWS_REGION" = "$expected_region"
          image="finnor-worker:${FINNOR_COMMIT_SHA}"
          registry="$account.dkr.ecr.${AWS_REGION}.amazonaws.com"
          existing_digest="$(aws ecr describe-images --repository-name finnor-worker --query "imageDetails[?contains(imageTags || \`[]\`, '${FINNOR_COMMIT_SHA}')].imageDigest | [0]" --output text)"
          if test "$existing_digest" = "None" -o -z "$existing_digest"; then
            node scripts/release/production-mutation-guard.mjs authorize ecr-publish
            aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"
            trap 'docker logout "$registry" >/dev/null 2>&1 || true' EXIT
            docker tag "$image" "$registry/finnor-worker:${FINNOR_COMMIT_SHA}"
            docker push "$registry/finnor-worker:${FINNOR_COMMIT_SHA}"
            docker logout "$registry" >/dev/null
            trap - EXIT
          else
            echo "Reusing immutable ECR image $existing_digest for $FINNOR_COMMIT_SHA"
          fi
          digest="$(aws ecr describe-images --repository-name finnor-worker --image-ids imageTag="$FINNOR_COMMIT_SHA" --query 'imageDetails[0].imageDigest' --output text)"
          test "$digest" != "None" -a -n "$digest"
          echo "FINNOR_ECR_IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "FINNOR_ECR_IMAGE_URI=$registry/finnor-worker@$digest" >> "$GITHUB_ENV"

      - name: Clear ECR AWS credentials before non-AWS steps
        run: |
          echo "AWS_ACCESS_KEY_ID=" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=" >> "$GITHUB_ENV"
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""

      - name: Pull protected production database configuration
        run: |
          config_dir="$RUNNER_TEMP/finnor-production-config"
          mkdir -p "$config_dir"
          VERCEL_ORG_ID="$(node -p "require('./infra/deployment/production.contract.json').topology.api.organizationId")"
          VERCEL_PROJECT_ID="$(node -p "require('./infra/deployment/production.contract.json').topology.api.projectId")"
          export VERCEL_ORG_ID VERCEL_PROJECT_ID
          (cd "$config_dir" && vercel pull --yes --environment=production --token "$VERCEL_TOKEN")
          protected_env="$config_dir/.vercel/.env.production.local"
          test -s "$protected_env"
          chmod 600 "$protected_env"
          echo "FINNOR_PROTECTED_DATABASE_ENV=$protected_env" >> "$GITHUB_ENV"
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Authenticate exact AWS project with GitHub OIDC for preflight
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN || 'arn:aws:iam::601804670058:role/finnor-github-actions-deploy' }}
          aws-region: ${{ env.AWS_REGION }}
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["cloudformation:DescribeStacks","ecr:DescribeImages","ecr:DescribeRepositories","ecs:DescribeClusters","ecs:DescribeServices","ecs:DescribeTaskDefinition","elasticloadbalancing:DescribeLoadBalancers","elasticloadbalancing:DescribeTargetGroups","elasticloadbalancing:DescribeListeners","elasticloadbalancing:DescribeLoadBalancerAttributes","ec2:DescribeSecurityGroups","ec2:DescribeNatGateways"],"Resource":"*"}]}

      - name: Preflight every AWS, Vercel, and database production target
        run: |
          node scripts/release/preflight-production.mjs \
            --database-env "$FINNOR_PROTECTED_DATABASE_ENV" \
            --image-digest "$FINNOR_ECR_IMAGE_DIGEST" \
            --output-file "$RUNNER_TEMP/production-preflight.json"
          echo "FINNOR_PREFLIGHT_EVIDENCE=$RUNNER_TEMP/production-preflight.json" >> "$GITHUB_ENV"
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Clear preflight AWS credentials before non-AWS mutation steps
        run: |
          echo "AWS_ACCESS_KEY_ID=" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=" >> "$GITHUB_ENV"
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""

      - name: Bind canonical realtime gateway into Vercel production
        run: node scripts/release/configure-vercel-realtime.mjs --apply
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Private Equity supplier canary app
        id: supplier_canary_app
        run: |
          set -o pipefail
          node scripts/release/deploy-production.mjs supplierCanaryApp --output-file "$RUNNER_TEMP/supplier-canary-app-release.json" | tee "$RUNNER_TEMP/supplier-canary-app-deploy.log"
          url="$(node -e 'const fs=require("node:fs"); const result=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!result.deploymentUrl) process.exit(1); process.stdout.write(result.deploymentUrl)' "$RUNNER_TEMP/supplier-canary-app-release.json")"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Verify Private Equity supplier canary app
        run: |
          url="${{ steps.supplier_canary_app.outputs.url }}"
          node scripts/release/verify-supplier-canary-release.mjs supplierCanaryApp "$url" "$FINNOR_COMMIT_SHA" "$FINNOR_BUILD_ID" "$FINNOR_VERSION"
          node scripts/release/verify-supplier-canary-release.mjs supplierCanaryApp https://finnor-supplier-canary-app.vercel.app "$FINNOR_COMMIT_SHA" "$FINNOR_BUILD_ID" "$FINNOR_VERSION"
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          VERCEL_SUPPLIER_CANARY_APP_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_SUPPLIER_CANARY_APP_AUTOMATION_BYPASS_SECRET }}

      - name: Deploy Private Equity supplier canary auth
        id: supplier_canary_auth
        run: |
          set -o pipefail
          node scripts/release/deploy-production.mjs supplierCanaryAuth --output-file "$RUNNER_TEMP/supplier-canary-auth-release.json" | tee "$RUNNER_TEMP/supplier-canary-auth-deploy.log"
          url="$(node -e 'const fs=require("node:fs"); const result=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!result.deploymentUrl) process.exit(1); process.stdout.write(result.deploymentUrl)' "$RUNNER_TEMP/supplier-canary-auth-release.json")"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Verify Private Equity supplier canary auth
        run: |
          url="${{ steps.supplier_canary_auth.outputs.url }}"
          node scripts/release/verify-supplier-canary-release.mjs supplierCanaryAuth "$url" "$FINNOR_COMMIT_SHA" "$FINNOR_BUILD_ID" "$FINNOR_VERSION"
          node scripts/release/verify-supplier-canary-release.mjs supplierCanaryAuth https://finnor-supplier-canary-auth.vercel.app "$FINNOR_COMMIT_SHA" "$FINNOR_BUILD_ID" "$FINNOR_VERSION"
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          VERCEL_SUPPLIER_CANARY_AUTH_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_SUPPLIER_CANARY_AUTH_AUTOMATION_BYPASS_SECRET }}

      - name: Migrate production database
        run: npm run release:migrate:production -- "$FINNOR_PROTECTED_DATABASE_ENV"
        working-directory: finnor-os
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Deploy prepared frontend
        id: frontend
        run: |
          set -o pipefail
          node scripts/release/deploy-production.mjs frontend --deploy-only --output-file "$RUNNER_TEMP/frontend-release.json" | tee "$RUNNER_TEMP/frontend-deploy.log"
          url="$(node -e 'const fs=require("node:fs"); const result=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!result.deploymentUrl) process.exit(1); process.stdout.write(result.deploymentUrl)' "$RUNNER_TEMP/frontend-release.json")"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Verify frontend deployment
        run: |
          node scripts/release/verify-live-release.mjs "${{ steps.frontend.outputs.url }}" "$FINNOR_COMMIT_SHA" "$FINNOR_BUILD_ID" "$FINNOR_VERSION" production frontend
          node scripts/release/verify-live-release.mjs https://finnorai.com "$FINNOR_COMMIT_SHA" "$FINNOR_BUILD_ID" "$FINNOR_VERSION" production frontend
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          VERCEL_FRONTEND_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_FRONTEND_AUTOMATION_BYPASS_SECRET }}

      - name: Deploy prepared API
        id: api
        run: |
          set -o pipefail
          node scripts/release/deploy-production.mjs api --deploy-only --output-file "$RUNNER_TEMP/api-release.json" | tee "$RUNNER_TEMP/api-deploy.log"
          url="$(node -e 'const fs=require("node:fs"); const result=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!result.deploymentUrl) process.exit(1); process.stdout.write(result.deploymentUrl)' "$RUNNER_TEMP/api-release.json")"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Verify API deployment
        run: |
          node scripts/release/verify-live-release.mjs "${{ steps.api.outputs.url }}" "$FINNOR_COMMIT_SHA" "$FINNOR_BUILD_ID" "$FINNOR_VERSION" production api
          node scripts/release/verify-live-release.mjs https://api-psi-brown-95.vercel.app "$FINNOR_COMMIT_SHA" "$FINNOR_BUILD_ID" "$FINNOR_VERSION" production api
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          VERCEL_API_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_API_AUTOMATION_BYPASS_SECRET }}

      - name: Authenticate exact AWS project with GitHub OIDC for fresh compute preflight
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN || 'arn:aws:iam::601804670058:role/finnor-github-actions-deploy' }}
          aws-region: ${{ env.AWS_REGION }}
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["cloudformation:DescribeStacks","ecr:DescribeImages","ecr:DescribeRepositories","ecs:DescribeClusters","ecs:DescribeServices","ecs:DescribeTaskDefinition","elasticloadbalancing:DescribeLoadBalancers","elasticloadbalancing:DescribeTargetGroups","elasticloadbalancing:DescribeListeners","elasticloadbalancing:DescribeLoadBalancerAttributes","ec2:DescribeSecurityGroups","ec2:DescribeNatGateways"],"Resource":"*"}]}

      - name: Refresh compute preflight immediately before AWS mutation
        run: |
          node scripts/release/preflight-production.mjs \
            --database-env "$FINNOR_PROTECTED_DATABASE_ENV" \
            --image-digest "$FINNOR_ECR_IMAGE_DIGEST" \
            --output-file "$RUNNER_TEMP/production-preflight.json"
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Authenticate exact AWS project with GitHub OIDC for ECS
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN || 'arn:aws:iam::601804670058:role/finnor-github-actions-deploy' }}
          aws-region: ${{ env.AWS_REGION }}
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["cloudformation:CreateChangeSet","cloudformation:DescribeChangeSet","cloudformation:DescribeStacks","cloudformation:ExecuteChangeSet","ecr:DescribeImages","ecr:DescribeRepositories","ecs:*","elasticloadbalancing:*","application-autoscaling:*","cloudwatch:*","ec2:*","iam:*","logs:DescribeLogGroups","logs:DescribeLogStreams","logs:GetLogEvents"],"Resource":"*"}]}

      - name: Deploy or resume governed four-class AWS compute plane
        run: |
          set -euo pipefail
          deploy_stage() {
            node scripts/release/deploy-aws-compute-plane.mjs \
              --stage="$1" \
              --preflight-evidence="$FINNOR_PREFLIGHT_EVIDENCE" \
              --database-env="$FINNOR_PROTECTED_DATABASE_ENV" \
              --image-digest="$FINNOR_ECR_IMAGE_DIGEST"
          }
          stage="$(aws cloudformation describe-stacks --stack-name finnor-production --query 'Stacks[0].Parameters[?ParameterKey==`ComputePlaneStage`].ParameterValue | [0]' --output text)"
          if test -z "$stage" -o "$stage" = "None"; then stage=legacy; fi
          case "$stage" in
            legacy) deploy_stage preparing; deploy_stage routing; deploy_stage finalized ;;
            preparing) deploy_stage routing; deploy_stage finalized ;;
            routing) deploy_stage finalized ;;
            finalized) deploy_stage rollout ;;
            *) echo "::error::unknown compute-plane stage $stage"; exit 1 ;;
          esac
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Clear ECS AWS credentials
        run: |
          echo "AWS_ACCESS_KEY_ID=" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=" >> "$GITHUB_ENV"
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""

      - name: Verify cross-runtime release and migration parity
        run: node scripts/release/verify-production-parity.mjs --database-env "$FINNOR_PROTECTED_DATABASE_ENV"
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          VERCEL_FRONTEND_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_FRONTEND_AUTOMATION_BYPASS_SECRET }}
          VERCEL_API_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_API_AUTOMATION_BYPASS_SECRET }}
          VERCEL_SUPPLIER_CANARY_APP_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_SUPPLIER_CANARY_APP_AUTOMATION_BYPASS_SECRET }}
          VERCEL_SUPPLIER_CANARY_AUTH_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_SUPPLIER_CANARY_AUTH_AUTOMATION_BYPASS_SECRET }}

      - name: Execute governed Phase 8 Water retirement protocol
        run: |
          node scripts/release/run-p8-production-water-retirement.mjs \
            --database-env "$FINNOR_PROTECTED_DATABASE_ENV" \
            --apply \
            --authorization-ref "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_API_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_API_AUTOMATION_BYPASS_SECRET }}
          VERCEL_SUPPLIER_CANARY_APP_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_SUPPLIER_CANARY_APP_AUTOMATION_BYPASS_SECRET }}
          VERCEL_SUPPLIER_CANARY_AUTH_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_SUPPLIER_CANARY_AUTH_AUTOMATION_BYPASS_SECRET }}

      - name: Verify final PE product authority readiness
        run: |
          node scripts/release/verify-production-readiness.mjs "${{ steps.api.outputs.url }}" "$FINNOR_COMMIT_SHA" api
          node scripts/release/verify-production-readiness.mjs https://api-psi-brown-95.vercel.app "$FINNOR_COMMIT_SHA" api
          npm --prefix finnor-os run release:p8-runtime-contract -- --readiness-url https://api-psi-brown-95.vercel.app
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          VERCEL_API_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_API_AUTOMATION_BYPASS_SECRET }}

      - name: Baseline, shadow-compare, and activate Scope-5 impact per eligible PE tenant
        run: npm run release:scope5:rollout -- "$FINNOR_PROTECTED_DATABASE_ENV"
        working-directory: finnor-os
        env:
          GH_TOKEN: ${{ github.token }}
