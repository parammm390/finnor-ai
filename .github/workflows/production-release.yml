name: production-release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: finnor-production-release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  canonical-graph-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finnor
          POSTGRES_PASSWORD: finnor
          POSTGRES_DB: finnor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finnor" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgres://finnor:finnor@localhost:5432/finnor
      FINNOR_CHAOS_TEST_CONTEXT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: finnor-os/package-lock.json

      - name: Install API/workspace dependencies
        run: npm ci
        working-directory: finnor-os

      - name: Verify migration bundle parity
        run: |
          npm run db:bundle
          git diff --exit-code packages/db/migrations-bundle.ts
        working-directory: finnor-os

      - name: Apply schema and checkpointer migrations
        run: |
          npm run db:migrate
          npm run setup:langgraph
        working-directory: finnor-os

      - name: Seed canonical Private Equity fixture
        run: npm run db:seed
        working-directory: finnor-os

      - name: Verify canonical traversal and tenant isolation
        run: npm test -- --run tests/integration/canonical-company-graph.test.ts tests/integration/tenant-isolation.test.ts
        working-directory: finnor-os

  phase5-readiness:
    needs: canonical-graph-gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finnor
          POSTGRES_PASSWORD: finnor
          POSTGRES_DB: finnor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finnor" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgres://finnor:finnor@localhost:5432/finnor
      FINNOR_CHAOS_TEST_CONTEXT: "1"
      FINNOR_RELEASE_SOURCE: github-actions
      NODE_ENV: test
      AUTH_DEV_BYPASS: "1"
      CERTIFICATION_SEED_ALLOWED: "1"
      CERTIFICATION_TEST_EMAILS: certification@example.invalid
      CERTIFICATION_TEST_PHONES: "+15550000001"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            finnor-os/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Install API/workspace dependencies
        run: npm ci
        working-directory: finnor-os

      - name: Derive commit-locked release metadata
        run: |
          sha="$(git rev-parse HEAD)"
          short="${sha:0:12}"
          echo "RELEASE_COMMIT_SHA=$sha" >> "$GITHUB_ENV"
          echo "FINNOR_COMMIT_SHA=$sha" >> "$GITHUB_ENV"
          echo "FINNOR_BUILD_ID=finnor-$short" >> "$GITHUB_ENV"
          echo "FINNOR_VERSION=0.1.0+$short" >> "$GITHUB_ENV"

      - name: Verify clean canonical release source
        run: npm run release:verify
        env:
          FINNOR_ENVIRONMENT: production

      - name: Apply migrations from an empty database
        run: |
          npm run db:bundle
          git diff --exit-code packages/db/migrations-bundle.ts
          npm run db:migrate
          npm run setup:langgraph
        working-directory: finnor-os

      - name: Seed Phase 5 certification fixture
        run: npm run db:seed
        working-directory: finnor-os

      - name: Install disposable legacy fixture seam
        run: npx tsx scripts/install-vertical-fixture-seam.ts
        working-directory: finnor-os

      - name: Phase 5 type, security, runtime, and regression suite
        run: |
          npm run openapi
          npm run typecheck
          # Phase 5 deliberately retires the Water-only conversation resolver.
          # Keep the obsolete Phase 6 integration fixture out of this release
          # gate so certification cannot re-enable retired Water entities.
          npm test -- --exclude tests/integration/phase6-conversation-context-kernel.test.ts
          npm run release:manifest
          npm run release:pe-domain-boundary
        working-directory: finnor-os

  release:
    needs: [canonical-graph-gate, phase5-readiness]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      FINNOR_RELEASE_SOURCE: github-actions
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.TENANT_PROBE_VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            finnor-os/package-lock.json

      - name: Require production credentials before any mutation
        run: |
          for name in VERCEL_TOKEN AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            test -n "${!name:-}" || { echo "::error::$name is missing from the production environment"; exit 1; }
          done

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@50.15.1

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Install API/workspace dependencies
        run: npm ci
        working-directory: finnor-os

      - name: Verify dependency manifests remain source-locked
        run: git diff --exit-code -- package.json package-lock.json finnor-os/package.json finnor-os/package-lock.json

      - name: Validate canonical deployment truth
        run: node scripts/release/validate-deployment-truth.mjs

      - name: Release governance regression tests
        run: node --test scripts/release/release-policy.test.mjs

      - name: Derive commit-locked release metadata
        run: |
          sha="$(git rev-parse HEAD)"
          short="${sha:0:12}"
          echo "RELEASE_COMMIT_SHA=$sha" >> "$GITHUB_ENV"
          echo "FINNOR_COMMIT_SHA=$sha" >> "$GITHUB_ENV"
          echo "FINNOR_BUILD_ID=finnor-$short" >> "$GITHUB_ENV"
          echo "FINNOR_VERSION=0.1.0+$short" >> "$GITHUB_ENV"
          echo "FINNOR_ENVIRONMENT=production" >> "$GITHUB_ENV"

      - name: Require production credentials before any mutation
        run: |
          for name in VERCEL_TOKEN AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            test -n "${!name:-}" || { echo "::error::$name is missing from the production environment"; exit 1; }
          done

      - name: Verify clean canonical Git source
        run: node scripts/release/verify-release.mjs

      - name: Authenticate exact Azure subscription with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Frontend quality gate
        run: |
          npm run lint
          npx tsc --noEmit -p tsconfig.json
          npm run test:unit
          npm run typecheck --prefix finnor-os

      - name: API typecheck gate
        run: npm run typecheck
        working-directory: finnor-os

      - name: Pull protected production database configuration
        run: |
          VERCEL_ORG_ID="$(node -p "require('../../../infra/deployment/production.contract.json').topology.api.organizationId")"
          VERCEL_PROJECT_ID="$(node -p "require('../../../infra/deployment/production.contract.json').topology.api.projectId")"
          export VERCEL_ORG_ID VERCEL_PROJECT_ID
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
        working-directory: finnor-os/apps/api

      - name: Refresh Product Truth certification sessions
        run: |
          auth_file="$RUNNER_TEMP/product-truth-auth.json"
          node scripts/release/refresh-product-truth-auth.mjs \
            --production-env finnor-os/apps/api/.vercel/.env.production.local \
            --output-file "$auth_file"
          AUTH_FILE="$auth_file" node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs"
          const auth = JSON.parse(readFileSync(process.env.AUTH_FILE, "utf8"))
          if (!auth.primary || !auth.secondary) throw new Error("refreshed Product Truth auth output is incomplete")
          console.log(`::add-mask::${auth.primary}`)
          console.log(`::add-mask::${auth.secondary}`)
          appendFileSync(process.env.GITHUB_ENV, `PRODUCT_TRUTH_AUTH_BEARER=${auth.primary}\nPRODUCT_TRUTH_OTHER_AUTH_BEARER=${auth.secondary}\n`)
          NODE
          rm -f "$auth_file"

      - name: Preflight every production target before mutation
        run: |
          node scripts/release/preflight-production.mjs \
            --database-env finnor-os/apps/api/.vercel/.env.production.local \
            --output-file "$RUNNER_TEMP/production-preflight.json"
          echo "FINNOR_PREFLIGHT_EVIDENCE=$RUNNER_TEMP/production-preflight.json" >> "$GITHUB_ENV"

      - name: Build commit-locked production artifacts before database mutation
        run: |
          node scripts/release/deploy-production.mjs frontend --prepare-only
          node scripts/release/deploy-production.mjs api --prepare-only
          node scripts/release/verify-release.mjs

      - name: Migrate production database
        run: npm run release:migrate:production -- apps/api/.vercel/.env.production.local
        working-directory: finnor-os

      - name: Deploy prepared frontend
        id: frontend
        run: |
          set -o pipefail
          node scripts/release/deploy-production.mjs frontend --deploy-only --output-file "$RUNNER_TEMP/frontend-release.json" | tee "$RUNNER_TEMP/frontend-deploy.log"
          url="$(sed -n 's/^FINNOR_DEPLOYMENT_URL=//p' "$RUNNER_TEMP/frontend-deploy.log" | tail -n 1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify frontend deployment
        run: |
          node scripts/release/verify-live-release.mjs "${{ steps.frontend.outputs.url }}" "$FINNOR_COMMIT_SHA" "$FINNOR_BUILD_ID" "$FINNOR_VERSION"
          node scripts/release/verify-live-release.mjs https://finnorai.com "$FINNOR_COMMIT_SHA" "$FINNOR_BUILD_ID" "$FINNOR_VERSION"

      - name: Deploy prepared API
        id: api
        run: |
          set -o pipefail
          node scripts/release/deploy-production.mjs api --deploy-only --output-file "$RUNNER_TEMP/api-release.json" | tee "$RUNNER_TEMP/api-deploy.log"
          url="$(sed -n 's/^FINNOR_DEPLOYMENT_URL=//p' "$RUNNER_TEMP/api-deploy.log" | tail -n 1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify API deployment
        run: |
          node scripts/release/verify-live-release.mjs "${{ steps.api.outputs.url }}" "$FINNOR_COMMIT_SHA" "$FINNOR_BUILD_ID" "$FINNOR_VERSION"
          node scripts/release/verify-live-release.mjs https://api-psi-brown-95.vercel.app "$FINNOR_COMMIT_SHA" "$FINNOR_BUILD_ID" "$FINNOR_VERSION"

      - name: Deploy Azure worker and embedded orchestrator
        run: node scripts/release/deploy-azure-worker.mjs --preflight-evidence "$FINNOR_PREFLIGHT_EVIDENCE"

      - name: Verify cross-runtime release and migration parity
        run: node scripts/release/verify-production-parity.mjs --database-env finnor-os/apps/api/.vercel/.env.production.local
