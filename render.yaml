services:
  - type: web
    name: finnor-api-preview
    runtime: node
    plan: free
    region: ohio
    autoDeployTrigger: 'off'
    buildCommand: npm ci --prefix finnor-os --no-audit --no-fund && NODE_OPTIONS=--max-old-space-size=4096 npm --prefix finnor-os run build --workspace @finnor/api
    startCommand: npm --prefix finnor-os run start --workspace @finnor/api -- --hostname 0.0.0.0
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22.22.3'
      - key: PORT
        value: '3100'
      - key: FINNOR_ENVIRONMENT
        value: staging
      - key: AUTH_DEV_BYPASS
        value: '0'
  - type: web
    name: finnor-site-preview
    runtime: node
    plan: free
    region: ohio
    autoDeployTrigger: 'off'
    buildCommand: npm ci --no-audit --no-fund && npm run build -- --webpack
    startCommand: npm run start -- --hostname 0.0.0.0
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: '22.22.3'
      - key: FINNOR_ENVIRONMENT
        value: staging
      - key: FINNOR_OS_API_URL
        value: https://finnor-api-preview.onrender.com
