      AlarmActions: [!Ref BackgroundScaleInPolicy]
  HeavyScaleOutAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: finnor-heavy-compute-pressure-high
      Namespace: FINNOR/ComputePlane
      MetricName: ScalePressure
      Dimensions: [{ Name: Environment, Value: production }, { Name: ServiceClass, Value: HEAVY }]
