  HeavyTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: finnor-heavy
      Cpu: '2048'
      Memory: '4096'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt WorkerExecutionRole.Arn
      TaskRoleArn: !GetAtt HeavyTaskRole.Arn
      RuntimePlatform:
