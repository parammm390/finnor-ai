AWSTemplateFormatVersion: '2010-09-09'
Description: FINNOR production worker on ECS Fargate with an HTTPS ALB SSE gateway.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@2

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-0d7e56436d2d05193
    Description: Existing default VPC used for the prototype worker service.
  PublicSubnet1:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-014251451583c1b79
    Description: Existing public subnet in the first availability zone.
  PublicSubnet2:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-07c14e3fee9606ce0
    Description: Existing public subnet in the second availability zone.
  CertificateArn:
    Type: String
    Description: ACM certificate ARN covering realtime.finnorai.com.
  GitHubOidcProviderArn:
    Type: String
    Description: IAM OIDC provider ARN for token.actions.githubusercontent.com.
  GitHubOwner:
    Type: String
    Default: parammm390
    Description: GitHub owner for the immutable repository subject claim.
  GitHubRepositoryName:
    Type: String
    Default: finnor-ai
    Description: GitHub repository name for the immutable repository subject claim.
  GitHubOwnerId:
    Type: String
    Default: '221117685'
    Description: Immutable GitHub owner ID for parammm390.
  GitHubRepositoryId:
    Type: String
    Default: '1306076635'
    Description: Immutable GitHub repository ID for parammm390/finnor-ai.
  GitHubEnvironment:
    Type: String
    Default: production
    Description: GitHub deployment environment bound to the OIDC role.
  ImageUri:
    Type: String
    Description: Immutable ECR image URI including its digest.
  ReleaseCommitSha:
    Type: String
    AllowedPattern: '[0-9a-fA-F]{40}'
    Description: Full Git SHA embedded in the worker release.
  ReleaseBuildId:
    Type: String
    Description: Commit-derived FINNOR build identifier.
  ReleaseVersion:
    Type: String
    Description: Commit-derived FINNOR version.
  CoreCertificationId:
    Type: String
    Description: P0-P6 core certification bound to this worker release.
  SecretMap:
    Type: String
    Default: '{"DATABASE_URL":"finnor/prod/database-url","GROQ_API_KEY":"finnor/prod/groq-api-key","REDIS_URL":"finnor/prod/redis-url","SENTRY_DSN":"finnor/prod/sentry-dsn","SUPABASE_SERVICE_ROLE_KEY":"finnor/prod/supabase-service-role-key","VAPI_API_KEY":"finnor/prod/vapi-api-key","VAPI_WEBHOOK_SECRET":"finnor/prod/vapi-webhook-secret"}'
    NoEcho: true
    Description: Canonical FINNOR_SECRET_IDS JSON map; contains identifiers, never secret values.
  SseAllowedOrigins:
    Type: String
    Default: https://finnorai.com
    Description: Allowed browser origin for the SSE gateway.
  SupabaseUrl:
    Type: String
    Default: https://kpxrnonhnhexutvdywbh.supabase.co
    Description: Public Supabase project URL used to verify browser bearer tokens.
  BootstrapWorker:
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'
    Description: Temporary public-node health endpoint used only to create the ALB/ECS foundation before the first immutable worker image exists.

Conditions:
  UseBootstrapWorker: !Equals [!Ref BootstrapWorker, 'true']

Resources:
  WorkerRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      AWSToolsMetrics:
        AWSAgentToolkit: aws-cloudformation@2
    Properties:
      RepositoryName: finnor-worker
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Retain the ten most recent immutable release images",
                "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 10},
                "action": {"type": "expire"}
              }
            ]
          }

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      AWSToolsMetrics:
        AWSAgentToolkit: aws-cloudformation@2
    Properties:
      LogGroupName: /ecs/finnor-worker
      RetentionInDays: 7

  WorkerCluster:
    Type: AWS::ECS::Cluster
    Metadata:
      AWSToolsMetrics:
        AWSAgentToolkit: aws-cloudformation@2
    Properties:
      ClusterName: finnor-production
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: service
          Value: finnor-worker
        - Key: environment
          Value: production

  WorkerExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      AWSToolsMetrics:
        AWSAgentToolkit: aws-cloudformation@2
    Properties:
      RoleName: finnor-ecs-execution
      Description: ECS Fargate image and CloudWatch Logs execution role for FINNOR.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*'
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: finnor-ecs-execution-minimal
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EcrAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: EcrPull
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt WorkerRepository.Arn
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${WorkerLogGroup.Arn}:*'

  WorkerTaskRole:
    Type: AWS::IAM::Role
    Metadata:
      AWSToolsMetrics:
        AWSAgentToolkit: aws-cloudformation@2
    Properties:
      RoleName: finnor-worker-task
      Description: FINNOR worker runtime role limited to its managed Secrets Manager namespace.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*'
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: finnor-worker-secrets-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadFinnorManagedSecrets
                Effect: Allow
                Action:
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:finnor/prod/database-url-*'
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:finnor/prod/groq-api-key-*'
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:finnor/prod/redis-url-*'
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:finnor/prod/sentry-dsn-*'
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:finnor/prod/supabase-service-role-key-*'
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:finnor/prod/vapi-api-key-*'
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:finnor/prod/vapi-webhook-secret-*'
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:finnor/tenants/*'
              - Sid: ManageFinnorTenantSecrets
                Effect: Allow
                Action:
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                  - secretsmanager:TagResource
                Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:finnor/tenants/*'
              - Sid: CreateFinnorTenantSecrets
                Effect: Allow
                Action: secretsmanager:CreateSecret
                Resource: '*'
                Condition:
                  StringLike:
                    secretsmanager:Name: finnor/tenants/*
              - Sid: DecryptFinnorManagedSecrets
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'secretsmanager.${AWS::Region}.amazonaws.com'

  GitHubActionsRole:
    Type: AWS::IAM::Role
    Metadata:
      AWSToolsMetrics:
        AWSAgentToolkit: aws-cloudformation@2
    Properties:
      RoleName: finnor-github-actions-deploy
      Description: GitHub main OIDC deployment role for FINNOR ECR and ECS releases.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepositoryName}@${GitHubRepositoryId}:environment:${GitHubEnvironment}'
      Policies:
        - PolicyName: finnor-github-actions-release
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EcrAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: EcrReleaseRepository
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:DescribeRepositories
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt WorkerRepository.Arn
              - Sid: EcsRelease
                Effect: Allow
                Action:
                  - ecs:DescribeClusters
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                  - ecs:RegisterTaskDefinition
                  - ecs:UpdateService
                Resource: '*'
              - Sid: LoadBalancerHealth
                Effect: Allow
                Action:
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeListeners
                  - elasticloadbalancing:DescribeLoadBalancerAttributes
                  - elasticloadbalancing:DescribeTargetHealth
                Resource: '*'
              - Sid: NetworkInspection
                Effect: Allow
                Action:
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeNatGateways
                Resource: '*'
              - Sid: ReleaseLogs
                Effect: Allow
                Action:
                  - logs:DescribeLogStreams
                  - logs:GetLogEvents
                Resource: !Sub '${WorkerLogGroup.Arn}:*'
              - Sid: PassOnlyFinnorRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt WorkerExecutionRole.Arn
                  - !GetAtt WorkerTaskRole.Arn

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      AWSToolsMetrics:
        AWSAgentToolkit: aws-cloudformation@2
    Properties:
      GroupDescription: Public HTTPS ingress for the FINNOR realtime ALB.
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: finnor-production-realtime-alb
        - Key: service
          Value: finnor-worker
      SecurityGroupIngress:
        - Description: HTTPS realtime ingress
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - Description: HTTP redirect to HTTPS
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - Description: ALB outbound to the worker and health checks
          IpProtocol: -1
          CidrIp: 0.0.0.0/0

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      AWSToolsMetrics:
        AWSAgentToolkit: aws-cloudformation@2
    Properties:
      GroupDescription: FINNOR worker ingress is limited to the realtime ALB.
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: finnor-production-worker
        - Key: service
          Value: finnor-worker
      SecurityGroupIngress:
        - Description: ALB-only worker HTTP and SSE ingress
          IpProtocol: tcp
          FromPort: 8090
          ToPort: 8090
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      SecurityGroupEgress:
        - Description: Worker outbound access to Supabase and configured providers
          IpProtocol: -1
          CidrIp: 0.0.0.0/0

  RealtimeLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Metadata:
      AWSToolsMetrics:
        AWSAgentToolkit: aws-cloudformation@2
    Properties:
      Name: finnor-production-realtime
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: '3600'
        - Key: routing.http2.enabled
          Value: 'true'
      Tags:
        - Key: service
          Value: finnor-worker
        - Key: environment
          Value: production

  WorkerTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Metadata:
      AWSToolsMetrics:
        AWSAgentToolkit: aws-cloudformation@2
    Properties:
      Name: finnor-worker
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 8090
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /healthz
      HealthCheckPort: traffic-port
      Matcher:
        HttpCode: '200'
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
        - Key: stickiness.enabled
          Value: 'false'
      Tags:
        - Key: service
          Value: finnor-worker

  HttpRedirectListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Metadata:
      AWSToolsMetrics:
        AWSAgentToolkit: aws-cloudformation@2
    Properties:
      LoadBalancerArn: !Ref RealtimeLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301

  HttpsRealtimeListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Metadata:
      AWSToolsMetrics:
        AWSAgentToolkit: aws-cloudformation@2
    Properties:
      LoadBalancerArn: !Ref RealtimeLoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WorkerTargetGroup

  WorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Metadata:
      AWSToolsMetrics:
        AWSAgentToolkit: aws-cloudformation@2
    Properties:
      Family: finnor-worker
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt WorkerExecutionRole.Arn
      TaskRoleArn: !GetAtt WorkerTaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: finnor-worker
          Image: !Ref ImageUri
          Essential: true
          StopTimeout: 120
          PortMappings:
            - ContainerPort: 8090
              HostPort: 8090
              Protocol: tcp
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: NODE_ENV
              Value: production
            - Name: FINNOR_ENVIRONMENT
              Value: production
            - Name: FINNOR_RELEASE_SOURCE
              Value: github-actions
            - Name: FINNOR_COMMIT_SHA
              Value: !Ref ReleaseCommitSha
            - Name: FINNOR_BUILD_ID
              Value: !Ref ReleaseBuildId
            - Name: FINNOR_VERSION
              Value: !Ref ReleaseVersion
            - Name: FINNOR_CORE_CERTIFICATION_ID
              Value: !Ref CoreCertificationId
            - Name: SUPABASE_URL
              Value: !Ref SupabaseUrl
            - Name: FINNOR_WORKER_DEPLOYMENT_ID
              Value: !Sub 'ecs:${AWS::StackName}:worker:${ReleaseCommitSha}'
            - Name: FINNOR_WORKER_CAPABILITIES
              Value: jobs,orchestration,computer,event-wake,connection-health,realtime,sse
            - Name: SECRETS_PROVIDER
              Value: aws-secrets-manager
            - Name: FINNOR_SECRET_IDS
              Value: !Ref SecretMap
            - Name: FINNOR_TENANT_SECRET_PREFIX
              Value: finnor/tenants
            - Name: JARVIS_SSE_ALLOWED_ORIGINS
              Value: !Ref SseAllowedOrigins
            - Name: WORKER_CONCURRENCY
              Value: '2'
            - Name: WORKER_INTERACTIVE_RESERVED_CONCURRENCY
              Value: '1'
            - Name: FINNOR_DB_POOL_MAX
              Value: '4'
            - Name: PORT
              Value: '8090'
            - Name: SSE_PORT
              Value: '8090'
          HealthCheck:
            Command:
              - CMD-SHELL
              - node -e "fetch('http://127.0.0.1:8090/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WorkerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          Command: !If
            - UseBootstrapWorker
            - - -e
              - !Sub |
                  const http=require('node:http');const body=JSON.stringify({ok:true,realtime:true,capabilities:['jobs','orchestration','computer','event-wake','connection-health','realtime','sse'],release:{commitSha:'${ReleaseCommitSha}',buildId:'${ReleaseBuildId}',version:'${ReleaseVersion}',environment:'production',source:'github-actions'}});http.createServer((req,res)=>{if(req.url==='/healthz'){res.writeHead(200,{'content-type':'application/json'});res.end(body);return;}res.writeHead(404);res.end();}).listen(8090,'0.0.0.0')
            - !Ref AWS::NoValue

  WorkerService:
    Type: AWS::ECS::Service
    DependsOn:
      - HttpsRealtimeListener
    Metadata:
      AWSToolsMetrics:
        AWSAgentToolkit: aws-cloudformation@2
    Properties:
      ServiceName: finnor-worker
      Cluster: !Ref WorkerCluster
      TaskDefinition: !Ref WorkerTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: LATEST
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
          SecurityGroups:
            - !Ref TaskSecurityGroup
      LoadBalancers:
        - ContainerName: finnor-worker
          ContainerPort: 8090
          TargetGroupArn: !Ref WorkerTargetGroup
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      Tags:
        - Key: service
          Value: finnor-worker
        - Key: environment
          Value: production

Outputs:
  WorkerRepositoryUri:
    Description: Immutable FINNOR worker ECR repository URI.
    Value: !GetAtt WorkerRepository.RepositoryUri
  WorkerClusterName:
    Description: ECS cluster name.
    Value: !Ref WorkerCluster
  WorkerServiceName:
    Description: ECS service name.
    Value: finnor-worker
  WorkerTaskDefinitionArn:
    Description: Current task definition revision.
    Value: !Ref WorkerTaskDefinition
  WorkerExecutionRoleArn:
    Description: ECS execution role ARN.
    Value: !GetAtt WorkerExecutionRole.Arn
  WorkerTaskRoleArn:
    Description: Worker runtime task role ARN.
    Value: !GetAtt WorkerTaskRole.Arn
  GithubActionsRoleArn:
    Description: GitHub OIDC deployment role ARN.
    Value: !GetAtt GitHubActionsRole.Arn
  LoadBalancerArn:
    Description: Realtime application load balancer ARN.
    Value: !Ref RealtimeLoadBalancer
  LoadBalancerDnsName:
    Description: ALB DNS name for realtime.finnorai.com.
    Value: !GetAtt RealtimeLoadBalancer.DNSName
  TargetGroupArn:
    Description: Worker target group ARN.
    Value: !Ref WorkerTargetGroup
  HttpsListenerArn:
    Description: HTTPS listener ARN.
    Value: !Ref HttpsRealtimeListener
  AlbSecurityGroupId:
    Description: ALB security group ID.
    Value: !Ref AlbSecurityGroup
  TaskSecurityGroupId:
    Description: Worker task security group ID.
    Value: !Ref TaskSecurityGroup
  WorkerLogGroupName:
    Description: Worker CloudWatch log group.
    Value: !Ref WorkerLogGroup
