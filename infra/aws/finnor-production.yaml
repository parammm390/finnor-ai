      EvaluationPeriods: 10
      DatapointsToAlarm: 10
      Threshold: 0.2
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref InteractiveScaleInPolicy]
  BackgroundScaleOutAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: finnor-background-compute-pressure-high
      Namespace: FINNOR/ComputePlane
      MetricName: ScalePressure
      Dimensions: [{ Name: Environment, Value: production }, { Name: ServiceClass, Value: BACKGROUND }]
