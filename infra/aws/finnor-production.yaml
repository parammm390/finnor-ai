          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WorkerLogGroup
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: heavy

  InteractiveService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: finnor-interactive
      Cluster: !Ref WorkerCluster
      TaskDefinition: !Ref InteractiveTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
          SecurityGroups: [!Ref ComputeTaskSecurityGroup]
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      Tags:
        - { Key: service, Value: finnor-interactive }
        - { Key: environment, Value: production }

  BackgroundService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: finnor-background
      Cluster: !Ref WorkerCluster
      TaskDefinition: !Ref BackgroundTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
          SecurityGroups: [!Ref ComputeTaskSecurityGroup]
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      Tags:
        - { Key: service, Value: finnor-background }
        - { Key: environment, Value: production }

  HeavyService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: finnor-heavy
      Cluster: !Ref WorkerCluster
      TaskDefinition: !Ref HeavyTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
          SecurityGroups: [!Ref ComputeTaskSecurityGroup]
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      Tags:
        - { Key: service, Value: finnor-heavy }
        - { Key: environment, Value: production }

  # Four independent bounded capacity targets. All minima are one: each class
  # owns its own metric publisher, so zero capacity would lose the wake signal.
  RealtimeScaleTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: RealtimeService
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub 'service/${WorkerCluster}/finnor-realtime'
      MinCapacity: 1
      MaxCapacity: 2
  InteractiveScaleTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: InteractiveService
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub 'service/${WorkerCluster}/finnor-interactive'
      MinCapacity: 1
      MaxCapacity: 3
  BackgroundScaleTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: BackgroundService
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub 'service/${WorkerCluster}/finnor-background'
      MinCapacity: 1
      MaxCapacity: 2
  HeavyScaleTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: HeavyService
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub 'service/${WorkerCluster}/finnor-heavy'
      MinCapacity: 1
      MaxCapacity: 2

  RealtimeScaleOutPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: finnor-realtime-scale-out
      PolicyType: StepScaling
      ScalingTargetId: !Ref RealtimeScaleTarget
      StepScalingPolicyConfiguration:
        AdjustmentType: ChangeInCapacity
        Cooldown: 60
        MetricAggregationType: Maximum
        StepAdjustments: [{ MetricIntervalLowerBound: 0, ScalingAdjustment: 1 }]
  RealtimeScaleInPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: finnor-realtime-scale-in
      PolicyType: StepScaling
      ScalingTargetId: !Ref RealtimeScaleTarget
      StepScalingPolicyConfiguration:
        AdjustmentType: ChangeInCapacity
        Cooldown: 600
        MetricAggregationType: Maximum
        StepAdjustments: [{ MetricIntervalUpperBound: 0, ScalingAdjustment: -1 }]
  InteractiveScaleOutPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: finnor-interactive-scale-out
      PolicyType: StepScaling
      ScalingTargetId: !Ref InteractiveScaleTarget
      StepScalingPolicyConfiguration:
        AdjustmentType: ChangeInCapacity
        Cooldown: 60
        MetricAggregationType: Maximum
        StepAdjustments: [{ MetricIntervalLowerBound: 0, ScalingAdjustment: 1 }]
  InteractiveScaleInPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: finnor-interactive-scale-in
      PolicyType: StepScaling
      ScalingTargetId: !Ref InteractiveScaleTarget
      StepScalingPolicyConfiguration:
        AdjustmentType: ChangeInCapacity
        Cooldown: 600
        MetricAggregationType: Maximum
        StepAdjustments: [{ MetricIntervalUpperBound: 0, ScalingAdjustment: -1 }]
  BackgroundScaleOutPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: finnor-background-scale-out
      PolicyType: StepScaling
      ScalingTargetId: !Ref BackgroundScaleTarget
      StepScalingPolicyConfiguration:
        AdjustmentType: ChangeInCapacity
        Cooldown: 120
        MetricAggregationType: Maximum
        StepAdjustments: [{ MetricIntervalLowerBound: 0, ScalingAdjustment: 1 }]
  BackgroundScaleInPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: finnor-background-scale-in
      PolicyType: StepScaling
      ScalingTargetId: !Ref BackgroundScaleTarget
      StepScalingPolicyConfiguration:
        AdjustmentType: ChangeInCapacity
        Cooldown: 900
        MetricAggregationType: Maximum
        StepAdjustments: [{ MetricIntervalUpperBound: 0, ScalingAdjustment: -1 }]
  HeavyScaleOutPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: finnor-heavy-scale-out
      PolicyType: StepScaling
      ScalingTargetId: !Ref HeavyScaleTarget
      StepScalingPolicyConfiguration:
        AdjustmentType: ChangeInCapacity
        Cooldown: 180
        MetricAggregationType: Maximum
        StepAdjustments: [{ MetricIntervalLowerBound: 0, ScalingAdjustment: 1 }]
  HeavyScaleInPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: finnor-heavy-scale-in
      PolicyType: StepScaling
      ScalingTargetId: !Ref HeavyScaleTarget
      StepScalingPolicyConfiguration:
        AdjustmentType: ChangeInCapacity
        Cooldown: 1200
        MetricAggregationType: Maximum
        StepAdjustments: [{ MetricIntervalUpperBound: 0, ScalingAdjustment: -1 }]

  # ScalePressure=max(oldest eligible age / class engineering target,
  # backlog per fresh running task / class engineering target). A publisher
  # failure emits no fabricated zero; missing data cannot cause scale-in.
  RealtimeScaleOutAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: finnor-realtime-compute-pressure-high
      Namespace: FINNOR/ComputePlane
      MetricName: ScalePressure
      Dimensions: [{ Name: Environment, Value: production }, { Name: ServiceClass, Value: REALTIME }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref RealtimeScaleOutPolicy]
  RealtimeScaleInAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: finnor-realtime-compute-pressure-low
      Namespace: FINNOR/ComputePlane
      MetricName: ScalePressure
      Dimensions: [{ Name: Environment, Value: production }, { Name: ServiceClass, Value: REALTIME }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 10
      DatapointsToAlarm: 10
      Threshold: 0.2
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref RealtimeScaleInPolicy]
  InteractiveScaleOutAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: finnor-interactive-compute-pressure-high
      Namespace: FINNOR/ComputePlane
      MetricName: ScalePressure
      Dimensions: [{ Name: Environment, Value: production }, { Name: ServiceClass, Value: INTERACTIVE }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref InteractiveScaleOutPolicy]
  InteractiveScaleInAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: finnor-interactive-compute-pressure-low
      Namespace: FINNOR/ComputePlane
      MetricName: ScalePressure
      Dimensions: [{ Name: Environment, Value: production }, { Name: ServiceClass, Value: INTERACTIVE }]
