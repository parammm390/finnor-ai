      AlarmActions: [!Ref BackgroundScaleOutPolicy]
  BackgroundScaleInAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: finnor-background-compute-pressure-low
      Namespace: FINNOR/ComputePlane
      MetricName: ScalePressure
      Dimensions: [{ Name: Environment, Value: production }, { Name: ServiceClass, Value: BACKGROUND }]
