AWSTemplateFormatVersion: '2010-09-09'
Description: FINNOR four-class production compute plane on ECS Fargate with a REALTIME-only HTTPS ALB SSE gateway.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@2

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-0d7e56436d2d05193
  PublicSubnet1:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-014251451583c1b79
  PublicSubnet2:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-07c14e3fee9606ce0
  CertificateArn:
    Type: String
  GitHubOidcProviderArn:
    Type: String
  GitHubOwner:
    Type: String
    Default: parammm390
  GitHubRepositoryName:
    Type: String
    Default: finnor-ai
  GitHubOwnerId:
    Type: String
    Default: '221117685'
  GitHubRepositoryId:
    Type: String
    Default: '1306076635'
  GitHubEnvironment:
    Type: String
    Default: production
  ImageUri:
    Type: String
  ReleaseCommitSha:
    Type: String
    AllowedPattern: '[0-9a-fA-F]{40}'
  ReleaseBuildId:
    Type: String
  ReleaseVersion:
    Type: String
  CoreCertificationId:
    Type: String
  SecretMap:
    Type: String
    Default: '{"DATABASE_URL":"finnor/prod/database-url","GROQ_API_KEY":"finnor/prod/groq-api-key","REDIS_URL":"finnor/prod/redis-url","SENTRY_DSN":"finnor/prod/sentry-dsn","SUPABASE_SERVICE_ROLE_KEY":"finnor/prod/supabase-service-role-key","VAPI_API_KEY":"finnor/prod/vapi-api-key","VAPI_WEBHOOK_SECRET":"finnor/prod/vapi-webhook-secret"}'
    NoEcho: true
  RealtimeSecretMap:
    Type: String
    Default: '{"DATABASE_URL":"finnor/prod/database-url","SENTRY_DSN":"finnor/prod/sentry-dsn","SUPABASE_SERVICE_ROLE_KEY":"finnor/prod/supabase-service-role-key"}'
    NoEcho: true
  HeavySecretMap:
    Type: String
    Default: '{"DATABASE_URL":"finnor/prod/database-url","GROQ_API_KEY":"finnor/prod/groq-api-key","REDIS_URL":"finnor/prod/redis-url","SENTRY_DSN":"finnor/prod/sentry-dsn"}'
    NoEcho: true
  SseAllowedOrigins:
    Type: String
    Default: https://finnorai.com
  SupabaseUrl:
    Type: String
    Default: https://kpxrnonhnhexutvdywbh.supabase.co
  ComputePlaneStage:
    Type: String
    AllowedValues: [preparing, routing, finalized]
    Default: preparing
    Description: Preparing warms class services; routing switches ingress while legacy drains; finalized removes legacy after drain proof.
  LegacyWorkerTaskDefinitionArn:
    Type: String
    Default: ''

Conditions:
  ComputePreparing: !Equals [!Ref ComputePlaneStage, preparing]
  ComputeRouting: !Equals [!Ref ComputePlaneStage, routing]
  HasLegacyWorkerTask: !Not [!Equals [!Ref LegacyWorkerTaskDefinitionArn, '']]
  RouteLegacyTraffic: !And [!Condition ComputePreparing, !Condition HasLegacyWorkerTask]
  RunLegacyWorker: !And [!Condition HasLegacyWorkerTask, !Or [!Condition ComputePreparing, !Condition ComputeRouting]]

Resources:
  WorkerRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: finnor-worker
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Retain the ten most recent immutable release images",
                "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 10},
                "action": {"type": "expire"}
              }
            ]
          }

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /ecs/finnor-worker
      RetentionInDays: 7

  WorkerCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: finnor-production
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: service
          Value: finnor-worker
        - Key: environment
          Value: production

  WorkerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: finnor-ecs-execution
      Description: ECS Fargate image and CloudWatch Logs execution role for FINNOR.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*'
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: finnor-ecs-execution-minimal
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EcrAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: EcrPull
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt WorkerRepository.Arn
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${WorkerLogGroup.Arn}:*'

  TenantProviderSecretPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: finnor-compute-tenant-provider
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Sid: ReadRotateTenantSecrets, Effect: Allow, Action: [secretsmanager:GetSecretValue, secretsmanager:PutSecretValue], Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:finnor/tenants/*' }
          - Sid: CreateTenantSecrets
            Effect: Allow
            Action: secretsmanager:CreateSecret
            Resource: '*'
            Condition: { StringLike: { 'secretsmanager:Name': 'finnor/tenants/*' } }
          - { Sid: SecretKmsForwardAccess, Effect: Allow, Action: [kms:Decrypt, kms:GenerateDataKey], Resource: '*', Condition: { StringEquals: { 'kms:ViaService': !Sub 'secretsmanager.${AWS::Region}.amazonaws.com' } } }
          - { Sid: MicrosoftOutboundIdentity, Effect: Allow, Action: [sts:GetWebIdentityToken, sts:TagGetWebIdentityToken], Resource: '*' }

  CoreRuntimeSecretPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: finnor-compute-core-runtime-secrets
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
              - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:finnor/prod/database-url-*'
              - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:finnor/prod/groq-api-key-*'
              - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:finnor/prod/redis-url-*'
              - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:finnor/prod/sentry-dsn-*'
              - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:finnor/prod/supabase-service-role-key-*'
              - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:finnor/prod/vapi-api-key-*'
              - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:finnor/prod/vapi-webhook-secret-*'

  WorkerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: finnor-worker-task
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: 'sts:AssumeRole', Condition: { ArnLike: { 'aws:SourceArn': !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*' }, StringEquals: { 'aws:SourceAccount': !Ref 'AWS::AccountId' } } }
      ManagedPolicyArns: [!Ref TenantProviderSecretPolicy, !Ref CoreRuntimeSecretPolicy]

  BackgroundTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: finnor-background-task
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: 'sts:AssumeRole', Condition: { ArnLike: { 'aws:SourceArn': !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*' }, StringEquals: { 'aws:SourceAccount': !Ref 'AWS::AccountId' } } }
      ManagedPolicyArns: [!Ref TenantProviderSecretPolicy, !Ref CoreRuntimeSecretPolicy]

  HeavyTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: finnor-heavy-task
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: 'sts:AssumeRole', Condition: { ArnLike: { 'aws:SourceArn': !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*' }, StringEquals: { 'aws:SourceAccount': !Ref 'AWS::AccountId' } } }
      ManagedPolicyArns: [!Ref TenantProviderSecretPolicy]
      Policies:
        - PolicyName: finnor-heavy-secret-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:finnor/prod/database-url-*'
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:finnor/prod/groq-api-key-*'
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:finnor/prod/redis-url-*'
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:finnor/prod/sentry-dsn-*'

  RealtimeTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: finnor-realtime-task
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*'
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: finnor-realtime-secrets-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:finnor/prod/database-url-*'
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:finnor/prod/sentry-dsn-*'
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:finnor/prod/supabase-service-role-key-*'
              - Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'secretsmanager.${AWS::Region}.amazonaws.com'

  GitHubActionsRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: short-lived production release identity; GitHub OIDC over stored AWS keys
        must:
          - AWS-supported sub binds immutable repo + owner IDs and the production environment
          - audience remains sts.amazonaws.com
        mutable: change-with-constraints
        mutability:
          AssumeRolePolicyDocument: change-with-constraints
    Properties:
      RoleName: finnor-github-actions-deploy
      Description: GitHub main OIDC role for governed FINNOR releases.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepositoryName}@${GitHubRepositoryId}:environment:${GitHubEnvironment}'
      Policies:
        - PolicyName: finnor-github-actions-release
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EcrAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: EcrReleaseRepository
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:DescribeRepositories
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt WorkerRepository.Arn
              - Sid: EcsRelease
                Effect: Allow
                Action:
                  - ecs:CreateService
                  - ecs:DeleteService
                  - ecs:DeregisterTaskDefinition
                  - ecs:DescribeClusters
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                  - ecs:RegisterTaskDefinition
                  - ecs:TagResource
                  - ecs:UntagResource
                  - ecs:UpdateClusterSettings
                  - ecs:UpdateService
                Resource: '*'
              - Sid: LoadBalancerHealth
                Effect: Allow
                Action:
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeListeners
                  - elasticloadbalancing:DescribeLoadBalancerAttributes
                  - elasticloadbalancing:DescribeTargetHealth
                  - elasticloadbalancing:AddTags
                  - elasticloadbalancing:CreateRule
                  - elasticloadbalancing:CreateTargetGroup
                  - elasticloadbalancing:DeleteRule
                  - elasticloadbalancing:DeleteTargetGroup
                  - elasticloadbalancing:ModifyListener
                  - elasticloadbalancing:ModifyRule
                  - elasticloadbalancing:ModifyTargetGroup
                  - elasticloadbalancing:ModifyTargetGroupAttributes
                  - elasticloadbalancing:RemoveTags
                Resource: '*'
              - Sid: NetworkInspection
                Effect: Allow
                Action:
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeNatGateways
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcs
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:CreateSecurityGroup
                  - ec2:CreateTags
                  - ec2:DeleteSecurityGroup
                  - ec2:DeleteTags
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupIngress
                Resource: '*'
              - Sid: GovernedStackChanges
                Effect: Allow
                Action: [cloudformation:CreateChangeSet, cloudformation:DescribeChangeSet, cloudformation:DescribeStacks, cloudformation:ExecuteChangeSet]
                Resource: '*'
              - Sid: ComputeScaling
                Effect: Allow
                Action: [application-autoscaling:RegisterScalableTarget, application-autoscaling:DeregisterScalableTarget, application-autoscaling:PutScalingPolicy, application-autoscaling:DeleteScalingPolicy, application-autoscaling:DescribeScalableTargets, application-autoscaling:DescribeScalingPolicies]
                Resource: '*'
              - Sid: ComputeAlarms
                Effect: Allow
                Action: [cloudwatch:PutMetricAlarm, cloudwatch:DeleteAlarms, cloudwatch:DescribeAlarms, cloudwatch:TagResource, cloudwatch:UntagResource]
                Resource: !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:finnor-*'
              - Sid: ComputeRoleLifecycle
                Effect: Allow
                Action: [iam:CreateRole, iam:DeleteRole, iam:GetRole, iam:TagRole, iam:UntagRole, iam:UpdateAssumeRolePolicy, iam:UpdateRole, iam:PutRolePolicy, iam:DeleteRolePolicy, iam:GetRolePolicy, iam:ListRolePolicies, iam:AttachRolePolicy, iam:DetachRolePolicy, iam:ListAttachedRolePolicies]
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/finnor-*'
              - Sid: ComputePolicyLifecycle
                Effect: Allow
                Action: [iam:CreatePolicy, iam:DeletePolicy, iam:GetPolicy, iam:CreatePolicyVersion, iam:DeletePolicyVersion, iam:GetPolicyVersion, iam:ListPolicyVersions, iam:TagPolicy, iam:UntagPolicy]
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/finnor-compute-*'
              - Sid: ComputeServiceLinkedRoles
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/*'
                Condition:
                  StringEquals:
                    iam:AWSServiceName: [ecs.amazonaws.com, ecs.application-autoscaling.amazonaws.com, elasticloadbalancing.amazonaws.com]
              - Sid: ReleaseLogs
                Effect: Allow
                Action:
                  - logs:DescribeLogStreams
                  - logs:GetLogEvents
                Resource: !Sub '${WorkerLogGroup.Arn}:*'
              - Sid: PassOnlyFinnorRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt WorkerExecutionRole.Arn
                  - !GetAtt WorkerTaskRole.Arn
                  - !GetAtt BackgroundTaskRole.Arn
                  - !GetAtt HeavyTaskRole.Arn
                  - !GetAtt RealtimeTaskRole.Arn

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS ingress for the FINNOR realtime ALB.
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: finnor-production-realtime-alb
        - Key: service
          Value: finnor-worker
      SecurityGroupIngress:
        - Description: HTTPS realtime ingress
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - Description: HTTP redirect to HTTPS
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - Description: ALB outbound to the worker and health checks
          IpProtocol: -1
          CidrIp: 0.0.0.0/0

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: FINNOR worker ingress is limited to the realtime ALB.
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: finnor-production-worker
        - Key: service
          Value: finnor-worker
      SecurityGroupIngress:
        - Description: ALB-only worker HTTP and SSE ingress
          IpProtocol: tcp
          FromPort: 8090
          ToPort: 8090
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      SecurityGroupEgress:
        - Description: Worker outbound access to Supabase and configured providers
          IpProtocol: -1
          CidrIp: 0.0.0.0/0

  ComputeTaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: No-ingress security group for FINNOR interactive, background, and heavy tasks.
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - Description: Outbound database and configured provider traffic
          IpProtocol: -1
          CidrIp: 0.0.0.0/0

  RealtimeLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: finnor-production-realtime
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: '3600'
        - Key: routing.http2.enabled
          Value: 'true'
      Tags:
        - Key: service
          Value: finnor-worker
        - Key: environment
          Value: production

  WorkerTargetGroup:
    Condition: RunLegacyWorker
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: finnor-worker
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 8090
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /healthz
      HealthCheckPort: traffic-port
      Matcher:
        HttpCode: '200'
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
        - Key: stickiness.enabled
          Value: 'false'
      Tags:
        - Key: service
          Value: finnor-worker

  RealtimeTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: finnor-realtime
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 8090
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /healthz
      HealthCheckPort: traffic-port
      Matcher:
        HttpCode: '200'
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
        - Key: stickiness.enabled
          Value: 'false'

  HttpRedirectListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref RealtimeLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301

  HttpsRealtimeListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref RealtimeLoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !If [RouteLegacyTraffic, !Ref WorkerTargetGroup, !Ref RealtimeTargetGroup]

  RealtimeWarmupListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsRealtimeListener
      Priority: 100
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values: [finnor-compute-warmup.invalid]
        - Field: path-pattern
          PathPatternConfig:
            Values: [/__finnor_warmup_only]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref RealtimeTargetGroup

  LegacyDrainListenerRule:
    Condition: RunLegacyWorker
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsRealtimeListener
      Priority: 101
      Conditions: [{ Field: host-header, HostHeaderConfig: { Values: [finnor-legacy-drain.invalid] } }]
      Actions: [{ Type: forward, TargetGroupArn: !Ref WorkerTargetGroup }]

  WorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Ingress-owning realtime profile remains independent while staged routing drains the legacy worker.
        must:
          - Use the same certified image digest and release as the other compute classes.
          - Only the realtime service receives SSE ingress; retain replaced revisions for rollback evidence.
        mutable: change-with-constraints
    Properties:
      Family: finnor-realtime
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt WorkerExecutionRole.Arn
      TaskRoleArn: !GetAtt RealtimeTaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: finnor-realtime
          Image: !Ref ImageUri
          Essential: true
          StopTimeout: 120
          PortMappings:
            - ContainerPort: 8090
              HostPort: 8090
              Protocol: tcp
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: NODE_ENV
              Value: production
            - Name: FINNOR_ENVIRONMENT
              Value: production
            - Name: FINNOR_RELEASE_SOURCE
              Value: github-actions
            - Name: FINNOR_COMMIT_SHA
              Value: !Ref ReleaseCommitSha
            - Name: FINNOR_BUILD_ID
              Value: !Ref ReleaseBuildId
            - Name: FINNOR_VERSION
              Value: !Ref ReleaseVersion
            - Name: FINNOR_CORE_CERTIFICATION_ID
              Value: !Ref CoreCertificationId
            - Name: SUPABASE_URL
              Value: !Ref SupabaseUrl
            - Name: FINNOR_WORKER_DEPLOYMENT_ID
              Value: !Sub 'ecs:${AWS::StackName}:realtime:${ReleaseCommitSha}'
            - Name: FINNOR_WORKLOAD_CLASS
              Value: REALTIME
            - Name: FINNOR_WORKER_CAPABILITIES
              Value: jobs,realtime,sse
            - Name: SECRETS_PROVIDER
              Value: aws-secrets-manager
            - Name: FINNOR_SECRET_IDS
              Value: !Ref RealtimeSecretMap
            - Name: FINNOR_TENANT_SECRET_PREFIX
              Value: finnor/tenants
            - Name: JARVIS_SSE_ALLOWED_ORIGINS
              Value: !Ref SseAllowedOrigins
            - Name: WORKER_CONCURRENCY
              Value: '2'
            - Name: WORKER_INTERACTIVE_RESERVED_CONCURRENCY
              Value: '0'
            - Name: FINNOR_DB_POOL_MAX
              Value: '1'
            - Name: PORT
              Value: '8090'
            - Name: SSE_PORT
              Value: '8090'
          HealthCheck:
            Command:
              - CMD-SHELL
              - node -e "fetch('http://127.0.0.1:8090/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WorkerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  WorkerService:
    Condition: RunLegacyWorker
    Type: AWS::ECS::Service
    DependsOn:
      - HttpsRealtimeListener
    Properties:
      ServiceName: finnor-worker
      Cluster: !Ref WorkerCluster
      TaskDefinition: !Ref LegacyWorkerTaskDefinitionArn
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: LATEST
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
          SecurityGroups:
            - !Ref TaskSecurityGroup
      LoadBalancers:
        - ContainerName: finnor-worker
          ContainerPort: 8090
          TargetGroupArn: !Ref WorkerTargetGroup
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      Tags:
        - Key: service
          Value: finnor-worker
        - Key: environment
          Value: production

  RealtimeService:
    Type: AWS::ECS::Service
    DependsOn: RealtimeWarmupListenerRule
    Properties:
      ServiceName: finnor-realtime
      Cluster: !Ref WorkerCluster
      TaskDefinition: !Ref WorkerTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: LATEST
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - ContainerName: finnor-realtime
          ContainerPort: 8090
          TargetGroupArn: !Ref RealtimeTargetGroup
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      Tags:
        - { Key: service, Value: finnor-realtime }
        - { Key: environment, Value: production }

  InteractiveTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: finnor-interactive
      Cpu: '1024'
      Memory: '2048'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt WorkerExecutionRole.Arn
      TaskRoleArn: !GetAtt WorkerTaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: finnor-interactive
          Image: !Ref ImageUri
          Essential: true
          StopTimeout: 120
          PortMappings:
            - ContainerPort: 8090
              Protocol: tcp
          Environment:
            - { Name: AWS_REGION, Value: !Ref 'AWS::Region' }
            - { Name: NODE_ENV, Value: production }
            - { Name: FINNOR_ENVIRONMENT, Value: production }
            - { Name: FINNOR_RELEASE_SOURCE, Value: github-actions }
            - { Name: FINNOR_COMMIT_SHA, Value: !Ref ReleaseCommitSha }
            - { Name: FINNOR_BUILD_ID, Value: !Ref ReleaseBuildId }
            - { Name: FINNOR_VERSION, Value: !Ref ReleaseVersion }
            - { Name: FINNOR_CORE_CERTIFICATION_ID, Value: !Ref CoreCertificationId }
            - { Name: SUPABASE_URL, Value: !Ref SupabaseUrl }
            - { Name: FINNOR_WORKER_DEPLOYMENT_ID, Value: !Sub 'ecs:${AWS::StackName}:interactive:${ReleaseCommitSha}' }
            - { Name: FINNOR_WORKLOAD_CLASS, Value: INTERACTIVE }
            - { Name: FINNOR_WORKER_CAPABILITIES, Value: 'jobs,orchestration,event-wake,workflow' }
            - { Name: SECRETS_PROVIDER, Value: aws-secrets-manager }
            - { Name: FINNOR_SECRET_IDS, Value: !Ref SecretMap }
            - { Name: FINNOR_TENANT_SECRET_PREFIX, Value: finnor/tenants }
            - { Name: WORKER_CONCURRENCY, Value: '2' }
            - { Name: FINNOR_DB_POOL_MAX, Value: '1' }
            - { Name: PORT, Value: '8090' }
          HealthCheck:
            Command: [CMD-SHELL, 'node -e "fetch(''http://127.0.0.1:8090/healthz'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WorkerLogGroup
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: interactive

  BackgroundTaskDefinition:
