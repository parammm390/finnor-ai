            - { Name: FINNOR_COMMIT_SHA, Value: !Ref ReleaseCommitSha }
            - { Name: FINNOR_BUILD_ID, Value: !Ref ReleaseBuildId }
            - { Name: FINNOR_VERSION, Value: !Ref ReleaseVersion }
            - { Name: FINNOR_CORE_CERTIFICATION_ID, Value: !Ref CoreCertificationId }
            - { Name: SUPABASE_URL, Value: !Ref SupabaseUrl }
            - { Name: FINNOR_WORKER_DEPLOYMENT_ID, Value: !Sub 'ecs:${AWS::StackName}:heavy:${ReleaseCommitSha}' }
            - { Name: FINNOR_WORKLOAD_CLASS, Value: HEAVY }
            - { Name: FINNOR_WORKER_CAPABILITIES, Value: 'jobs,computer,artifact' }
            - { Name: SECRETS_PROVIDER, Value: aws-secrets-manager }
            - { Name: FINNOR_SECRET_IDS, Value: !Ref HeavySecretMap }
            - { Name: FINNOR_TENANT_SECRET_PREFIX, Value: finnor/tenants }
            - { Name: WORKER_CONCURRENCY, Value: '1' }
            - { Name: FINNOR_DB_POOL_MAX, Value: '1' }
            - { Name: PORT, Value: '8090' }
          HealthCheck:
            Command: [CMD-SHELL, 'node -e "fetch(''http://127.0.0.1:8090/healthz'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
            Interval: 30
            Timeout: 5
            Retries: 3
