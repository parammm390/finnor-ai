title = "FINNOR secret detection with exact non-secret business metadata"

[extend]
useDefault = true

# Exact non-secret fields only. Keep evidence and fixture files fully scanned;
# never exclude a directory or credential-shaped field.
[[rules]]
id = "generic-api-key"
# Other attributes inherit the pinned scanner's default generic-api-key rule.

[[rules.allowlists]]
description = "Exact canonical UUIDs and authored fixture identifiers; credential fields remain scanned"
condition = "AND"
paths = [
  '''(^|/)docs/centropy/evidence/.*\.json$''',
  '''(^|/)finnor-os/scripts/seed-centropy-ic-template\.ts$''',
  '''(^|/)finnor-os/scripts/seed-phase9-e2e\.ts$''',
  '''(^|/)scripts/centropy/verify-secret-scan-policy\.mjs$''',
]
regexTarget = "match"
regexes = [
  '''(?i)(?:executionKey|idempotencyKey)"?\s*:\s*"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"''',
  '''(?:"?(?:templateKey|template_key)"?\s*[:=]\s*"centropy_ic_default_v1"|versionKey"?\s*:\s*"centropy-growth-bps-e2e-v2")''',
  '''(?:sourceKey|idempotencyKey)\s*:\s*"phase9-[a-z0-9-]+"''',
]

# An authored S4 model identity is public fixture metadata, never a credential.
# Match only this field/value on this exact source path; credential fields remain scanned.
[[rules.allowlists]]
description = "Exact authored S4 delayed-actor model identifier"
condition = "AND"
paths = ['''(^|/)finnor-os/scripts/s4/run-s4-e2e\.mts$''']
regexTarget = "match"
regexes = ['''modelKey\s*=\s*['"]s4-actual-delayed-actor['"]''']

# These exact static underwriting identities are public authored metadata.
# Anchor the entire detector match, not a whole source line or arbitrary modelKey.
[[rules.allowlists]]
description = "Exact authored M1 CPU and live-revocation model identifiers"
condition = "AND"
paths = ['''(^|/)finnor-os/scripts/m1/run-e2e\.mts$''']
regexTarget = "match"
regexes = ['''^modelKey:'m1-(?:cpu-boundary|live-revocation)'$''']

[[rules.allowlists]]
description = "Exact authored P4 frontier consumer and incumbent model identifiers"
condition = "AND"
paths = ['''(^|/)finnor-os/scripts/p4/frontier-comparison\.mts$''']
regexTarget = "match"
regexes = ['''^modelKey: 'p4-frontier-(?:consumer|incumbent)'$''']

# The default detector spans these two adjacent remainingPredicates strings.
# This does not exempt idempotencyKey, other predicates, or any credential field.
[[rules.allowlists]]
description = "Exact adjacent authored S6 remaining-predicate labels"
condition = "AND"
paths = ['''(^|/)finnor-os/packages/private-equity/src/program-synthesis/owners\.ts$''']
regexTarget = "match"
regexes = ['''^S6_EXACT_APPROVAL_AND_CREDENTIAL_EGRESS','S6_INDEPENDENT_OBSERVATION'$''']

# Complete history also contains this single literal test reference. Do not
# exempt runtime idempotency values or other values on this source path.
[[rules.allowlists]]
description = "Exact authored M4 duplicate-request fixture reference"
condition = "AND"
paths = ['''(^|/)finnor-os/scripts/m4/run-e2e\.mts$''']
regexTarget = "match"
regexes = ['''^idempotencyKey:'m4-idempotency'$''']

[[rules.allowlists]]
description = "Exact authored nonconsequential M3 candidate identity"
condition = "AND"
paths = ['''(^|/)finnor-os/packages/private-equity/src/capital-program/v2-owners\.ts$''']
regexTarget = "match"
regexes = ['''^candidateKey:'m3-nonconsequential-proposal'$''']

# This literal belongs to a local synthetic Auth server, not a usable token.
# Keep every other refresh-token value and every other path fully scanned,
# including the complete history of side parents and merge resolutions.
[[rules.allowlists]]
description = "Exact synthetic R2 local Auth refresh-token placeholder"
condition = "AND"
paths = ['''(^|/)finnor-os/scripts/r2/run-owner\.mts$''']
regexTarget = "match"
regexes = ['''^refresh_token:'r2-disposable'$''']

# This exact static underwriting model name is public synthetic metadata.
# Other model names, credential fields and paths remain fully scanned.
[[rules.allowlists]]
description = "Exact authored R6 synthetic underwriting model identifier"
condition = "AND"
paths = ['''(^|/)finnor-os/scripts/r6/run-e2e\.mts$''']
regexTarget = "match"
regexes = ['''^modelKey: "r6-synthetic-mechanics"$''']

# Static request identity for the disposable publication-revocation fixture.
# Neither runtime idempotency values nor other fields on this path are exempt.
[[rules.allowlists]]
description = "Exact authored R8 publication-fault request identifier"
condition = "AND"
paths = ['''(^|/)finnor-os/scripts/r8/run-owner\.mts$''']
regexTarget = "match"
regexes = ['''^idempotencyKey:'r8-publish-fault'$''']

# This is the checked SHA-256 of y0's public identification API source.
# Only its exact detector match on these two R4 method files is metadata.
[[rules.allowlists]]
description = "Exact verified public y0 identification API source pin"
condition = "AND"
paths = [
  '''(^|/)finnor-os/packages/epistemic-runtime/src/identification-plan/producer\.py$''',
  '''(^|/)finnor-os/packages/epistemic-runtime/src/identification-plan/checker\.py$''',
]
regexTarget = "match"
regexes = ['''^api\.py": "ad107d01a61c9ba1df2c71ca8e128851c6f3b1fee3f9377d5159c34d6b0e50c4"$''']

# A fixed mode enum records the disposable authentication boundary, not a token.
[[rules.allowlists]]
description = "Exact R4 disposable authentication-boundary mode enum"
condition = "AND"
paths = ['''(^|/)finnor-os/scripts/r4/browser\.mts$''']
regexTarget = "match"
regexes = ['''^authentication: "DISPOSABLE_RS256_NO_BYPASS"$''']

# Each value is the verified SHA-256 of the named public migration, not a key.
[[rules.allowlists]]
description = "Four exact public SQL source pins in this release allocation"
condition = "AND"
paths = ['''(^|/)docs/release/completed-release-2026-10-08/migration-allocation\.json$''']
regexTarget = "match"
regexes = [
  '''^0141_restricted_digest_projection_access\.sql": "45f4832a2e63eecbab99ccb8ef38c47491ce5f4afef2d6e935df87c090b41aab"$''',
  '''^0085_phase1_identity_access_fabric\.sql": "59f49a2e99bb4c495091e8647e903767f0daf098b6bd7ad1878421e2bd37a982"$''',
  '''^0088_staging_os_keychain_auth_profiles\.sql": "da578eb5b1aeaf158fa568eb3ead7e3b7d64ca92ef8df523297e9dbca77ce57a"$''',
  '''^0079_tenant_credential_references\.sql": "a8b237e21706c24856c625d0bd6a4c1bc6979c86fab7fbb6c625a923fac660ba"$''',
]

# The detector mistakes this exact requirements prose fragment for a token.
# Never exempt the containing JSON line or any other token semantics.
[[rules.allowlists]]
description = "Exact authored observation-time requirements prose fragment"
condition = "AND"
paths = [
  '''(^|/)scope-pm/completion-c/all-ten-gates\.json$''',
  '''(^|/)scope-pm/completion-c/all-ten-requirements\.json$''',
]
regexTarget = "match"
regexes = ['''^token semantics, observed/available/known $''']

# This is the SHA-256 of the R3 source-seal OpenAPI artifact, not a credential.
# Match the exact JSON field on this exact path; other hashes and credential-shaped
# fields remain covered by the default detector.
[[rules.allowlists]]
description = "Exact R3 source-seal OpenAPI SHA-256 metadata"
condition = "AND"
paths = ['''(^|/)scope-r/r3-incentive-rule-synthesis/handoff/source-seal\.json$''']
regexTarget = "line"
regexes = ['''"openapiSha256": "[0-9a-f]{64}"''']

# This is a literal disposable key for local R3 browser fixtures. It is never a
# hosted credential; every other auth-key value remains fully scanned.
[[rules.allowlists]]
description = "Exact R3 disposable browser-auth placeholders"
condition = "AND"
paths = [
  '''(^|/)finnor-os/scripts/r3/browser-proof\.mts$''',
  '''(^|/)finnor-os/scripts/r3/browser-tool-proof\.mts$''',
]
regexTarget = "line"
regexes = ["""NEXT_PUBLIC_SUPABASE_ANON_KEY: 'r3-disposable-publishable-key'"""]

# These lines record verified public source digests in the unpublished R3
# handoff. Match only the specific API/worker SHA-256 token finding on these
# exact paths; do not allowlist other findings elsewhere on the long paragraph.
[[rules.allowlists]]
description = "Exact R3 public API and worker source digest pairs"
condition = "AND"
paths = [
  '''(^|/)scope-r/r3-incentive-rule-synthesis/handoff/draft-pr\.md$''',
  '''(^|/)scope-r/r3-incentive-rule-synthesis/handoff/README\.md$''',
  '''(^|/)scope-r/r3-incentive-rule-synthesis/status\.md$''',
]
regexTarget = "match"
regexes = [
  '''(?:API|worker) sha256:[0-9a-f]{64}''',
]

# The generated repair plan records exact public preimage hashes, not secrets.
# Keep the field names and owning plan path exact.
[[rules.allowlists]]
description = "Exact R3 generated-context OpenAPI/client preimage hashes"
condition = "AND"
paths = ['''(^|/)scope-r/r3-incentive-rule-synthesis/generated-context-contract-repair-plan\.json$''']
regexTarget = "line"
regexes = [
  '''"finnor-os/openapi\.json": "[0-9a-f]{64}"''',
  '''"src/lib/centropy/openapi-types\.ts": "[0-9a-f]{64}"''',
  '''"src/lib/jarvis/openapi-types\.ts": "[0-9a-f]{64}"''',
]
